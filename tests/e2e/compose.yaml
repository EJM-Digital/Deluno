# The end-to-end stack (docs/exec-plans/active/PLAN-E2E-IN-CI.md): Deluno's own image, the five download clients, Weir and the suite's
# fixture, on one private network. Nothing in a scenario reaches the internet; the only pulls are these images.
#
#   docker compose -f tests/e2e/compose.yaml up --build --wait
#   npx playwright test -c tests/e2e/playwright.config.ts
#   docker compose -f tests/e2e/compose.yaml down --volumes
#
# DELUNO_IMAGE is the image the CI docker job built (or `docker build -t deluno:e2e .` locally). Ports are published on
# 127.0.0.1 only so the spec can read each application's own API.
name: deluno-e2e

services:
  # Makes the shared folders writable by the users inside the containers (Deluno runs as 1654; qBittorrent is told the same).
  prepare:
    build: ./fixture
    # qBittorrent's first settings file is the suite's login (user e2e, password in tests/e2e/stack.ts); the rest is set through its API.
    entrypoint: ["sh", "-c", "mkdir -p /downloads/completed/Movies /downloads/completed/TV /downloads/incomplete /media/Movies /media/TV /weir/Ready/Movies /weir/Ready/TV /pack /config/qBittorrent && if [ ! -f /config/qBittorrent/qBittorrent.conf ]; then cp /qbit-seed/qBittorrent.conf /config/qBittorrent/qBittorrent.conf; fi && if [ ! -f /sab-config/sabnzbd.ini ]; then cp /sab-seed/sabnzbd.ini /sab-config/sabnzbd.ini; fi && sh /fixture/make-certs.sh /certs && chown -R 1654:1654 /downloads /media /weir /pack /config /sab-config"]
    user: root
    volumes:
      - downloads:/downloads
      - media:/media
      - weir-output:/weir
      - pack:/pack
      - certs:/certs
      - qbittorrent-config:/config
      - sabnzbd-config:/sab-config
      - ./qbittorrent:/qbit-seed:ro
      - ./sabnzbd:/sab-seed:ro

  deluno:
    image: ${DELUNO_IMAGE:-deluno:e2e}
    pull_policy: never
    depends_on:
      prepare:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${E2E_DELUNO_PORT:-5099}:8080"
    environment:
      ASPNETCORE_URLS: http://+:8080
      Server__Port: 8080
      Server__AllowLan: "true"
      Storage__DataRoot: /data
      # The authority the stack made (make-certs.sh) is trusted beside the system's own, so the GitHub stand-in's certificate for
      # api.github.com is accepted. Nothing else about Deluno's trust changes.
      SSL_CERT_DIR: /etc/ssl/certs:/e2e-certs/ca
    volumes:
      - certs:/e2e-certs:ro
      - deluno-data:/data
      - downloads:/downloads
      - media:/media
      - weir-output:/weir
      - pack:/pack
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 20

  # qBittorrent, as linuxserver publishes it (5.2.4 when pinned), by digest.
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent@sha256:97333cc1ccf903e0bbcd8eb67e3332e4970e9c1ecabe145e499e9c0847ebcaed
    depends_on:
      prepare:
        condition: service_completed_successfully
    environment:
      PUID: "1654"
      PGID: "1654"
      TZ: Etc/UTC
      WEBUI_PORT: "8080"
    ports:
      - "127.0.0.1:${E2E_QBIT_PORT:-18081}:8080"
    volumes:
      - qbittorrent-config:/config
      - downloads:/downloads
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--output", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 5s
      timeout: 5s
      start_period: 20s
      retries: 20

  # Transmission, as linuxserver publishes it (4.1.3 when pinned), by digest. It keeps its shipped login (none); the spec sets
  # its folders and turns DHT, PEX and local discovery off through its own RPC, so a torrent with a web seed downloads from the fixture.
  transmission:
    image: lscr.io/linuxserver/transmission@sha256:d6caecad406774a18511be7bfa99ba5070c17a3bdd7a5d73091651841603273c
    depends_on:
      prepare:
        condition: service_completed_successfully
    environment:
      PUID: "1654"
      PGID: "1654"
      TZ: Etc/UTC
      HOST_WHITELIST: "*"
      WHITELIST: "*"
    ports:
      - "127.0.0.1:${E2E_TRANSMISSION_PORT:-19091}:9091"
    volumes:
      - transmission-config:/config
      - downloads:/downloads
    healthcheck:
      test: ["CMD", "curl", "--silent", "--output", "/dev/null", "http://127.0.0.1:9091/transmission/web/"]
      interval: 5s
      timeout: 5s
      start_period: 20s
      retries: 20

  # Deluge (web interface and daemon), as linuxserver publishes it (2.2.0 when pinned), by digest. Its shipped web login is
  # "deluge"; the spec sets its folders and turns DHT, PEX and local discovery off through its own JSON-RPC.
  deluge:
    image: lscr.io/linuxserver/deluge@sha256:bf306ddd5e6d4a85d3d05ce1b947ab6e344e7fca1b7740b77c58ce170118c7ff
    depends_on:
      prepare:
        condition: service_completed_successfully
    environment:
      PUID: "1654"
      PGID: "1654"
      TZ: Etc/UTC
    ports:
      - "127.0.0.1:${E2E_DELUGE_PORT:-18112}:8112"
    volumes:
      - deluge-config:/config
      - downloads:/downloads
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--output", "/dev/null", "http://127.0.0.1:8112/"]
      interval: 5s
      timeout: 5s
      start_period: 20s
      retries: 20

  # SABnzbd, as linuxserver publishes it (5.1.3 when pinned), by digest. Its first settings file (tests/e2e/sabnzbd/sabnzbd.ini)
  # carries the suite's key, the host name Deluno reaches it by, its folders and the fixture as its one news server.
  sabnzbd:
    image: lscr.io/linuxserver/sabnzbd@sha256:7a13af91cf296399e302d2fb6fc709d6e2ea15e3094f220684611fbe1dd43625
    depends_on:
      prepare:
        condition: service_completed_successfully
      fixture:
        condition: service_healthy
    environment:
      PUID: "1654"
      PGID: "1654"
      TZ: Etc/UTC
    ports:
      - "127.0.0.1:${E2E_SABNZBD_PORT:-18083}:8080"
    volumes:
      - sabnzbd-config:/config
      - downloads:/downloads
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--output", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 5s
      timeout: 5s
      start_period: 20s
      retries: 20

  # NZBGet, as linuxserver publishes it (26.3 when pinned), by digest. It keeps its shipped login; the spec points it at the
  # fixture's news server and sets its folders and category through its own JSON-RPC.
  nzbget:
    image: lscr.io/linuxserver/nzbget@sha256:ab18af1d16027fdf870fc58a39bbc764043b16e9220e06b9d0413e8b56bd622b
    depends_on:
      prepare:
        condition: service_completed_successfully
      fixture:
        condition: service_healthy
    environment:
      PUID: "1654"
      PGID: "1654"
      TZ: Etc/UTC
    ports:
      - "127.0.0.1:${E2E_NZBGET_PORT:-16789}:6789"
    volumes:
      - nzbget-config:/config
      - downloads:/downloads
    healthcheck:
      test: ["CMD", "curl", "--silent", "--output", "/dev/null", "http://127.0.0.1:6789/"]
      interval: 5s
      timeout: 5s
      start_period: 20s
      retries: 20

  # Weir, the processor Deluno hands a finished download to before it imports, as Weir publishes it (by digest).
  weir:
    image: ghcr.io/jampat000/weir@sha256:77a2de6920d6ef7fc3fa3bc4a55dc13ae8318ee46a08d01527eb248362e9f674
    hostname: weir
    depends_on:
      prepare:
        condition: service_completed_successfully
    environment:
      WEIR_HOME: /data/weir
      WEIR_PUID: "1654"
      WEIR_PGID: "1654"
    ports:
      - "127.0.0.1:${E2E_WEIR_PORT:-19347}:9347"
    volumes:
      - weir-data:/data/weir
      - downloads:/downloads
      - weir-output:/weir

  # The local Torznab and Newznab feeds, the web seed for the torrents, the news server (NNTP, port 1119) for the Usenet releases
  # and a read-only look at the shared folders.
  fixture:
    build: ./fixture
    depends_on:
      prepare:
        condition: service_completed_successfully
    environment:
      FIXTURE_PUBLIC_BASE: http://fixture:8765
      # Weir leaves a file under 50 MB alone (its own default), so the film is a little over it; the extra stays well under.
      FIXTURE_FILM_MB: "64"
    ports:
      - "127.0.0.1:${E2E_FIXTURE_PORT:-18765}:8765"
    volumes:
      - fixture-work:/work
      - downloads:/downloads:ro
      - media:/media:ro
      - weir-output:/weir:ro
      - pack:/pack
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8765/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 5s
      timeout: 5s
      start_period: 15s
      retries: 20

  # Group github only (docker compose --profile github): GitHub's API with its hourly allowance used up, and GitHub's other names unreachable.
  # See tests/e2e/fixture/github.mjs for what is GitHub's own recorded reply and what is not.
  github-api:
    profiles: ["github"]
    build: ./fixture
    entrypoint: ["node", "/fixture/github.mjs"]
    depends_on:
      prepare:
        condition: service_completed_successfully
    networks:
      default:
        aliases:
          - api.github.com
    ports:
      - "127.0.0.1:${E2E_GITHUB_PORT:-18443}:8081"
    volumes:
      - certs:/certs:ro
      - ../fixtures/recorded/github/2022-11-28:/recorded:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8081/').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 5s
      timeout: 5s
      start_period: 10s
      retries: 20

  # Nothing listens here: github.com (the release feeds), www.github.com and codeload.github.com (the definitions archive) refuse the
  # connection, as the VM's hosts file did by pointing github.com at a closed port.
  github-closed:
    profiles: ["github"]
    build: ./fixture
    entrypoint: ["sleep", "infinity"]
    networks:
      default:
        aliases:
          - github.com
          - www.github.com
          - codeload.github.com

volumes:
  certs:
  pack:
  deluno-data:
  downloads:
  media:
  qbittorrent-config:
  transmission-config:
  deluge-config:
  sabnzbd-config:
  nzbget-config:
  fixture-work:
  weir-data:
  weir-output:
