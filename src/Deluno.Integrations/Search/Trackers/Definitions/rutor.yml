# Deluno's own definition (#606), written from Rutor's own search results
# page, not copied from any indexer manager. Every row already carries a
# magnet link, so no second page is needed to grab a release.
id: rutor
name: Rutor
description: A public general tracker. Every row already carries a magnet link.
language: ru-RU
type: public
encoding: UTF-8
links:
  - https://rutor.info/
  - https://rutor.is/
caps:
  categorymappings:
    - {id: movies, cat: Movies, desc: Movies}
    - {id: tv, cat: TV, desc: "TV"}
  modes:
    search: [q]
    movie-search: [q]
    tv-search: [q]
search:
  paths:
    - path: "search/0/0/000/0/{{ .Keywords }}"
  # Each result is a row of the table inside div#index, striped "gai" and
  # "tum"; the header row is "backgr". The second cell holds the .torrent
  # link (a.downgif), the magnet, and the title link to /torrent/<id>/.
  rows:
    selector: "div#index tr.gai, div#index tr.tum"
  fields:
    title:
      selector: "a[href^='/torrent/']"
    details:
      selector: "a[href^='/torrent/']"
      attribute: href
    magnet:
      selector: "a[href^='magnet:']"
      attribute: href
    size:
      selector: "td:nth-last-child(2)"
    seeders:
      selector: "span.green"
    leechers:
      selector: "span.red"
