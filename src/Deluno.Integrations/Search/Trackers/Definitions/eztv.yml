# Deluno's own definition (#606), written from EZTV's public JSON API
# (eztvx.to/api/get-torrents), not copied from any indexer manager.
id: eztv
name: EZTV
description: A public TV tracker. Its API answers by IMDb id only, so Deluno asks it that way and reads what it already has magnets for.
language: en-US
type: public
encoding: UTF-8
links:
  - https://eztvx.to/
  - https://eztv.re/
caps:
  categorymappings:
    - {id: tv, cat: TV, desc: "TV shows"}
  modes:
    tv-search: [imdbid]
search:
  paths:
    - path: "api/get-torrents"
      response:
        type: json
      inputs:
        imdb_id: "{{ .Query.IMDBIDShort }}"
        limit: "100"
        page: "1"
  rows:
    selector: torrents
    count:
      selector: torrents_count
  fields:
    title:
      selector: title
    magnet:
      selector: magnet_url
    infohash:
      selector: hash
    size:
      selector: size_bytes
    seeders:
      selector: seeds
    leechers:
      selector: peers
    date:
      selector: date_released_unix
    imdbid:
      selector: imdb_id
      optional: true
    category:
      text: tv
