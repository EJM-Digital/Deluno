# KEPT over the built-in Prowlarr file of the same id (#986): this one uses EZTV's JSON API by IMDb id (exact for a film or show); the built-in file only searches by keyword on the HTML site, which sits behind Cloudflare.
# Deluno's own definition (#606), written from EZTV's public JSON API
# (eztvx.to/api/get-torrents), not copied from any indexer manager.
id: eztv
name: EZTV
description: A public TV tracker. Its API answers by IMDb id only, so Deluno asks it that way and reads what it already has magnets for.
language: en-US
type: public
encoding: UTF-8
links:
  - https://eztvx.to/
  - https://eztv.re/
caps:
  categorymappings:
    - {id: tv, cat: TV, desc: "TV shows"}
  modes:
    tv-search: [q, season, ep, imdbid]
search:
  paths:
    - path: "api/get-torrents"
      response:
        type: json
      inputs:
        imdb_id: "{{ .Query.IMDBIDShort }}"
        limit: "100"
        page: "1"
  # Without an IMDb id the API answers with its newest torrents from every
  # show, so a row is kept only when its title carries every search word:
  # an unrelated latest episode is not a result.
  rows:
    selector: torrents
    filters:
      - name: andmatch
    count:
      selector: torrents_count
  fields:
    title:
      selector: title
    magnet:
      selector: magnet_url
    infohash:
      selector: hash
    size:
      selector: size_bytes
    seeders:
      selector: seeds
    leechers:
      selector: peers
    date:
      selector: date_released_unix
    imdbid:
      selector: imdb_id
      optional: true
    # Each row names its own season and episode, so a release is held to the
    # one the search asked for rather than any episode of the show.
    season:
      selector: season
      optional: true
    episode:
      selector: episode
      optional: true
    category:
      text: tv
