# Deluno's own definition (#606), written from 1337x's own search results
# page, not copied from any indexer manager. 1337x sits behind a Cloudflare
# check on most addresses; Deluno reaches it through a Cloudflare helper
# (FlareSolverr or Byparr), configured under Settings, General.
id: 1337x
name: 1337x
description: A public general tracker. Search results only link to a torrent's details page; the magnet is fetched from there when a release is grabbed.
language: en-US
type: public
encoding: UTF-8
links:
  - https://1337x.to/
  - https://1337x.st/
settings:
  - name: flaresolverr_help
    type: info_flaresolverr
    label: "This site sometimes needs a Cloudflare helper (FlareSolverr or Byparr). Set its address under Settings, General."
caps:
  categorymappings:
    - {id: Movies, cat: Movies, desc: Movies}
    - {id: TV, cat: TV, desc: "TV"}
    - {id: Anime, cat: TV/Anime, desc: Anime}
    - {id: Apps, cat: PC, desc: Applications}
    - {id: Games, cat: PC/Games, desc: Games}
    - {id: Music, cat: Audio, desc: Music}
    - {id: Documentaries, cat: TV/Documentary, desc: Documentaries}
    - {id: Other, cat: Other, desc: Other}
  modes:
    search: [q]
    movie-search: [q]
    tv-search: [q]
search:
  paths:
    - path: "search/{{ .Keywords }}/1/"
  rows:
    selector: "table.table-list tbody tr"
  fields:
    title:
      selector: "td.coll-1.name a:nth-of-type(2)"
    details:
      selector: "td.coll-1.name a:nth-of-type(2)"
      attribute: href
    download:
      selector: "td.coll-1.name a:nth-of-type(2)"
      attribute: href
    category:
      selector: "td.coll-1.name a:nth-of-type(1)"
      attribute: href
      filters:
        - name: regexp
          args: "^/cat/([^/]+)/"
      optional: true
    seeders:
      selector: "td.coll-2"
    leechers:
      selector: "td.coll-3"
    size:
      selector: "td.coll-4"
      remove: span
# The search row only links to the torrent's details page; the magnet is on
# that page, behind whatever Cloudflare check the address currently has.
download:
  selectors:
    - selector: "a[href^='magnet:']"
      attribute: href
