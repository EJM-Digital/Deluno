# Deluno's own definition (#606), written from nyaa.si's own search results
# page, not copied from any indexer manager.
id: nyaasi
name: Nyaa.si
description: A public anime tracker. Every row already carries a magnet link, so no second page is needed to grab a release.
language: en-US
type: public
encoding: UTF-8
links:
  - https://nyaa.si/
caps:
  categorymappings:
    - {id: "1_2", cat: TV/Anime, desc: "Anime - English-translated"}
    - {id: "1_3", cat: TV/Anime, desc: "Anime - Non-English-translated"}
    - {id: "1_4", cat: TV/Anime, desc: "Anime - Raw"}
  modes:
    search: [q]
    tv-search: [q]
search:
  paths:
    - path: ""
      inputs:
        q: "{{ .Keywords }}"
        f: "0"
        c: "1_0"
  rows:
    selector: "table.torrent-list tbody tr"
  fields:
    title:
      selector: "td:nth-of-type(2) a:not(.comments)"
    details:
      selector: "td:nth-of-type(2) a:not(.comments)"
      attribute: href
    download:
      selector: "td:nth-of-type(3) a[href$='.torrent']"
      attribute: href
      optional: true
    magnet:
      selector: "td:nth-of-type(3) a[href^='magnet:']"
      attribute: href
      optional: true
    size:
      selector: "td:nth-of-type(4)"
    date:
      selector: "td:nth-of-type(5)"
      attribute: data-timestamp
    seeders:
      selector: "td:nth-of-type(6)"
    leechers:
      selector: "td:nth-of-type(7)"
