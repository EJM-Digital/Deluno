# Deluno's own definition (#606), written from YTS's public JSON API
# (documented at yts.mx/api), not copied from any indexer manager.
id: yts
name: YTS
description: A public film tracker. Every quality of a title is its own release, with the film's IMDb id on each one.
language: en-US
type: public
encoding: UTF-8
links:
  - https://yts.mx/
  - https://yts.gg/
caps:
  categorymappings:
    - {id: movies, cat: Movies, desc: Movies}
  modes:
    search: [q, imdbid]
    movie-search: [q, imdbid]
search:
  paths:
    - path: "api/v2/list_movies.json"
      response:
        type: json
      inputs:
        query_term: "{{ if .Query.IMDBID }}{{ .Query.IMDBID }}{{ else }}{{ .Keywords }}{{ end }}"
        limit: "50"
  rows:
    selector: data.movies
    attribute: torrents
    multiple: true
    count:
      selector: data.movie_count
  fields:
    title_long:
      selector: "..title_long"
    quality:
      selector: quality
    kind:
      selector: type
    title:
      text: "{{ .Result.title_long }} {{ .Result.quality }} {{ .Result.kind }}-YTS"
    details:
      selector: "..url"
    download:
      selector: url
    infohash:
      selector: hash
    size:
      selector: size_bytes
    seeders:
      selector: seeds
    leechers:
      selector: peers
    imdbid:
      selector: "..imdb_code"
      optional: true
    date:
      selector: date_uploaded_unix
    category:
      text: movies
