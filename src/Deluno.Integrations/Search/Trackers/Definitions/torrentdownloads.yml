# Deluno's own definition (#606), written from TorrentDownloads' own search
# RSS feed (rss.xml?type=search), not copied from any indexer manager. Each
# item carries its size, seeders, leechers and info hash, so a release is
# grabbed from its magnet with no second page to fetch.
id: torrentdownloads
name: TorrentDownloads
description: A public general tracker, read from its own search RSS feed. Every item carries its info hash, so a release is grabbed by magnet.
language: en-US
type: public
encoding: UTF-8
links:
  - https://www.torrentdownloads.pro/
caps:
  categorymappings:
    - {id: movies, cat: Movies, desc: Movies}
    - {id: tv, cat: TV, desc: "TV"}
  modes:
    search: [q]
    movie-search: [q]
    tv-search: [q]
search:
  paths:
    - path: "rss.xml"
      response:
        type: xml
      inputs:
        type: search
        search: "{{ .Keywords }}"
  rows:
    selector: "item"
  fields:
    title:
      selector: title
    details:
      selector: link
    infohash:
      selector: info_hash
    size:
      selector: size
    seeders:
      selector: seeders
    leechers:
      selector: leechers
    date:
      selector: pubDate
