# Deluno's own definition (#606), written from The Pirate Bay's public
# apibay.org JSON API, not copied from any indexer manager.
id: thepiratebay
name: The Pirate Bay
description: A public general tracker. Its own apibay.org API returns magnets, sizes and seed counts directly, with no page to scrape.
language: en-US
type: public
encoding: UTF-8
links:
  - https://apibay.org/
  - https://thepiratebay.org/
caps:
  categorymappings:
    - {id: "201", cat: Movies, desc: Movies}
    - {id: "202", cat: Movies/DVD, desc: "Movies DVDR"}
    - {id: "204", cat: Movies, desc: "Movie clips"}
    - {id: "206", cat: Movies, desc: Handheld}
    - {id: "207", cat: Movies/HD, desc: "HD Movies"}
    - {id: "209", cat: Movies/3D, desc: "3D"}
    - {id: "211", cat: Movies/UHD, desc: "UHD/4k Movies"}
    - {id: "205", cat: TV, desc: "TV shows"}
    - {id: "208", cat: TV/HD, desc: "HD TV shows"}
    - {id: "212", cat: TV/UHD, desc: "UHD/4k TV shows"}
  allowrawsearch: true
  modes:
    search: [q]
    movie-search: [q]
    tv-search: [q]
search:
  paths:
    # Absolute on purpose: an indexer saved with the site's own address
    # (thepiratebay.org) must still reach the API, not the web page.
    - path: "https://apibay.org/q.php"
      response:
        type: json
      inputs:
        q: "{{ .Keywords }}"
  rows:
    selector: "$"
  fields:
    id:
      selector: id
    title:
      selector: name
    infohash:
      selector: info_hash
    details:
      text: "https://thepiratebay.org/description.php?id={{ .Result.id }}"
    size:
      selector: size
    seeders:
      selector: seeders
    leechers:
      selector: leechers
    imdbid:
      selector: imdb
      optional: true
    date:
      selector: added
    category:
      selector: category
