# Deluno's own definition (#606), written from LimeTorrents' own search
# results page, not copied from any indexer manager.
id: limetorrents
name: LimeTorrents
description: A public general tracker. Search results only link to a details page; the real download link is fetched from there when a release is grabbed.
language: en-US
type: public
encoding: UTF-8
links:
  - https://www.limetorrents.fun/
  - https://www.limetorrents.pro/
  - https://www.limetorrents.info/
caps:
  categorymappings:
    - {id: Movies, cat: Movies, desc: Movies}
    - {id: "TV shows", cat: TV, desc: "TV shows"}
    - {id: Anime, cat: TV/Anime, desc: Anime}
    - {id: Music, cat: Audio, desc: Music}
    - {id: Games, cat: PC/Games, desc: Games}
    - {id: Applications, cat: PC, desc: Applications}
    - {id: Other, cat: Other, desc: Other}
  modes:
    search: [q]
    movie-search: [q]
    tv-search: [q]
search:
  paths:
    - path: "search/all/{{ .Keywords }}/"
      followredirect: true
  rows:
    selector: "table.table2 tr:has(td.tdleft)"
  fields:
    title:
      selector: "div.tt-name a:nth-of-type(2)"
    details:
      selector: "div.tt-name a:nth-of-type(2)"
      attribute: href
    download:
      selector: "div.tt-name a:nth-of-type(2)"
      attribute: href
    date:
      selector: "td:nth-of-type(2)"
      filters:
        - name: regexp
          args: "^(.*?) - in "
    category:
      selector: "td:nth-of-type(2)"
      filters:
        - name: regexp
          args: " - in (.*)$"
      optional: true
    size:
      selector: "td:nth-of-type(3)"
    seeders:
      selector: td.tdseed
    leechers:
      selector: td.tdleech
# The search row only links to the torrent's details page; the magnet (or
# the itorrents.net .torrent link the page also carries) is fetched from
# there when a release is grabbed, not from the search results themselves.
download:
  selectors:
    - selector: "a[href^='magnet:']"
      attribute: href
    - selector: "a.csprite_dl14"
      attribute: href
