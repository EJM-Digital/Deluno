# One release: push a tag v* -> the Windows installer and the container image are built, and each is published by
# its own job once the checks it depends on have passed. This is the only workflow that publishes (it replaces
# docker.yml, which pushed the image on a tag by itself, so the image could be public for a release whose checks
# had not passed).
#
# Tags are made only after CI is green on that commit and after the golden path has passed on it (James, 3 and 7 Oct
# 2026). Every job but the two publish jobs starts at once and none of them can publish anything:
#
#   ci-passed         ci.yml's ci-passed job already passed on this exact commit (scripts/verify-ci-for-release.mjs).
#                     It does not wait: a tag made while CI is still running fails here, and the fix is to wait for
#                     CI and re-run this release.
#   golden-path       the golden path already passed on this exact commit: a `golden-path` commit status of
#                     `success` on it (scripts/verify-golden-path-for-release.mjs, docs/golden-path.md). It does
#                     not wait either.
#   validate          release-only checks: the tag is the version the build carries, and its release notes exist.
#   windows           builds, packs and uploads the Windows installer, portable zip, update packages and SHA256SUMS
#                     (an artifact, not public).
#   docker-candidate  builds the linux/amd64 image unpushed, scans it, and starts it.
#
# Two jobs publish, one per thing published. Neither waits for the other, so a slow or failed Docker build never holds
# back the Windows release, and either can be re-run alone (`gh run rerun --job`):
#
#   publish-windows   needs ci-passed, golden-path, validate and windows. It alone has `contents: write` and creates
#                     the GitHub Release: the installer, the update files and the notes, which name the Docker image.
#   publish-docker    needs ci-passed, golden-path, validate and docker-candidate. It alone has `packages: write` and
#                     the registry login. It pushes the version tag, attests, checks and starts the pushed image,
#                     and only then moves the moving tags (major.minor and latest) as its last step. A release
#                     candidate moves none.
#
# scripts/check-release-workflow-gates.mjs enforces that shape.
name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  # Two pushes of the same tag queue; the second never cancels the first part-way through publishing.
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  # The tag that triggered this run, named once here rather than read from ${{ github.ref_name }} inside script text.
  TAG: ${{ github.ref_name }}

jobs:
  ci-passed:
    name: CI passed on the tagged commit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: ci.yml passed on the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/verify-ci-for-release.mjs

      # The download clients the installer puts on are pinned; a pin more than a minor version behind the project, or a
      # project that was archived, stops the release until the pin is bumped with the project's published checksum (#1131).
      - name: The installer's pinned download clients are not stale
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check-component-pins.mjs

  # Does not wait either: the golden path is run on this commit's own build before the tag is made, and whoever ran it
  # recorded the result as a commit status. A tag made without one fails at once, saying what to run
  # (docs/golden-path.md).
  golden-path:
    name: Golden path passed on the tagged commit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      statuses: read
    steps:
      # The full history, so an earlier commit's golden-path pass can be carried over when no shipped file changed since.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: The golden path passed on the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/verify-golden-path-for-release.mjs

  # What CI cannot know: which tag this is. The build carries the version in Directory.Build.props and the update card
  # reads RELEASE_NOTES.md, so a tag that disagrees with either would ship a build that calls itself something else.
  validate:
    name: Release version and notes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: The tag is the version the build carries
        run: |
          built="$(sed -n 's:.*<Version>\([^<]*\)</Version>.*:\1:p' Directory.Build.props | head -n 1 | tr -d '[:space:]')"
          if [ "v${built}" != "${TAG}" ]; then
            echo "::error::The tag is ${TAG} but Directory.Build.props builds ${built:-no version}. Tag the commit that sets the version."
            exit 1
          fi

      - name: Release notes have a section for this version
        run: |
          if ! grep -Eq "^## ${TAG#v}[[:space:]]*$" RELEASE_NOTES.md; then
            echo "::error::RELEASE_NOTES.md has no '## ${TAG#v}' section (docs/ga-release-checklist.md)."
            exit 1
          fi

  windows:
    name: Windows Velopack packages
    runs-on: windows-latest
    # Observed 4.5 to 7 minutes. Windows minutes bill at twice the rate, so a hang is expensive.
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      GITHUB_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "npm"

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      - name: Extract version
        id: version
        shell: pwsh
        run: |
          $version = $env:TAG.TrimStart('v')
          # 0.x and explicitly prerelease-tagged builds are validation/preview
          # candidates. They must be packed onto their own feed, rather than
          # allowing a fresh install to jump to the stable release channel.
          $channel = if ($version.StartsWith("0.") -or $version -match "-(rc|beta|preview)([.-]|$)") { "rc" } else { "stable" }
          echo "version=$version" >> $env:GITHUB_OUTPUT
          echo "tag=$env:TAG" >> $env:GITHUB_OUTPUT
          echo "channel=$channel" >> $env:GITHUB_OUTPUT

      - name: Install npm dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build:web

      - name: Publish Deluno.Tray (win-x64)
        shell: pwsh
        run: |
          # A release runner is normally clean, but packaging must never pick
          # up a removed component from a reused workspace or cached output.
          Remove-Item -LiteralPath "artifacts/windows/bin" -Recurse -Force -ErrorAction SilentlyContinue
          dotnet publish apps/windows-tray/Deluno.Tray.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=false `
            -p:Version=${{ steps.version.outputs.version }} `
            -p:DelunoUpdateChannel=${{ steps.version.outputs.channel }} `
            -o artifacts/windows/bin

      # The bundled tools are downloaded by pinned scripts that check each download against a SHA-256 before using
      # it (#1124). The caches are keyed by the script that holds the pin, so a changed pin is a different key.
      # A cache saved by a tag run is readable only by that tag's later attempts (GitHub scopes caches to the ref),
      # so this saves the second attempt of a release, not the next release.
      - name: Cache FFmpeg
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tools/ffmpeg/win-x64
          key: ${{ runner.os }}-ffmpeg-${{ hashFiles('scripts/fetch-ffmpeg.ps1') }}

      - name: Cache UnRAR
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tools/unrar/win-x64
          key: ${{ runner.os }}-unrar-${{ hashFiles('scripts/fetch-unrar.ps1') }}

      # Through scripts/fetch-ffmpeg.ps1, which is the same call the lab publish
      # makes. This step used to download its own copy, and the two had drifted
      # in three ways that all reached the shipped installer:
      #
      #   * it took the GPL build. fetch-ffmpeg.ps1 takes LGPL shared, and says
      #     why: the GPL builds cannot ship inside a product.
      #   * it took master-latest, so two publishes of the same commit produced
      #     different bytes. The script pins a dated build, by hash.
      #   * it copied only ffprobe.exe. Subtitle timing sync needs ffmpeg.exe
      #     and cannot exist without it, so that feature was dark on every
      #     installed copy while working on the lab - which is exactly the shape
      #     of bug nobody finds, because the environment that could see it was
      #     the one that did not have the problem.
      - name: Bundle FFmpeg
        shell: pwsh
        run: |
          ./scripts/fetch-ffmpeg.ps1 -RuntimeIdentifier win-x64
          $source = "tools/ffmpeg/win-x64"
          $target = "artifacts/windows/bin/tools/ffmpeg"
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          Copy-Item -Path "$source/*" -Destination $target -Recurse -Force

          # The resolver looks in tools/ffmpeg before it looks loose beside the
          # executable, so both are found. Assert it rather than trust it: a
          # silently absent binary is how this went unnoticed the first time.
          foreach ($required in @("ffmpeg.exe", "ffprobe.exe")) {
            $path = Join-Path $target $required
            if (-not (Test-Path $path)) { Write-Error "$required is missing from the package"; exit 1 }
            Write-Host "bundled $required ($([math]::Round((Get-Item $path).Length / 1MB, 1)) MB)"
          }

      - name: Bundle UnRAR.exe (rarlab; extraction-only is license-clean)
        shell: pwsh
        run: |
          # UnRAR's source license forbids using the source to build a competing
          # archiver, but extraction-only use of the official binary is permitted.
          # The upstream license is shipped alongside (license.txt).
          try {
            ./scripts/fetch-unrar.ps1 -RuntimeIdentifier win-x64
            $target = "artifacts/windows/bin/tools/unrar"
            New-Item -ItemType Directory -Force -Path $target | Out-Null
            Copy-Item -Path "tools/unrar/win-x64/*" -Destination $target -Exclude ".sha256" -Force
          } catch {
            # A download that is not the pinned file is never shipped, and it
            # stops the release. Anything else (rarlab unreachable, say) costs
            # one import path, not the release.
            if ($_.Exception.Message -like "UnRAR checksum mismatch*") { Write-Error $_.Exception.Message; exit 1 }
            Write-Warning "UnRAR could not be fetched ($($_.Exception.Message)); users will need to install unrar themselves."
          }

      - name: Install Velopack CLI
        shell: pwsh
        run: dotnet tool install -g vpk --version 0.0.1298

      - name: Prepare code signing certificate
        shell: pwsh
        env:
          SIGN_CERT_BASE64: ${{ secrets.WINDOWS_SIGN_CERT_BASE64 }}
          SIGN_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGN_CERT_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SIGN_CERT_BASE64) -or [string]::IsNullOrWhiteSpace($env:SIGN_CERT_PASSWORD)) {
            Write-Host "Signing secrets not configured; continuing unsigned for this run."
            exit 0
          }
          $bytes = [Convert]::FromBase64String($env:SIGN_CERT_BASE64)
          $path = "$env:RUNNER_TEMP\\codesign.pfx"
          [IO.File]::WriteAllBytes($path, $bytes)
          "CERT_PATH=$path" >> $env:GITHUB_ENV

      # Deluno ships unsigned, by decision: a code-signing certificate is a
      # recurring cost this project is not paying, and the consequence -
      # SmartScreen warning on first install - is accepted and documented for
      # users rather than hidden.
      #
      # This step used to hard-fail any 1.x build without a certificate, which
      # meant no 1.x release could be produced at all once that decision was
      # made. Signing still happens automatically if the secrets are ever
      # added; it is simply no longer a gate.
      - name: Report signing status
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CERT_PATH)) {
            Write-Host "::warning::Publishing UNSIGNED. Windows SmartScreen will warn on first install. See docs/ga-release-checklist.md."
          } else {
            Write-Host "Code-signing certificate is present; artifacts will be signed."
          }

      - name: Sign payload executables
        if: ${{ env.CERT_PATH != '' }}
        shell: pwsh
        env:
          SIGN_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGN_CERT_PASSWORD }}
        run: |
          $executables = Get-ChildItem artifacts/windows/bin -Filter "*.exe" -File -ErrorAction SilentlyContinue
          if (-not $executables) {
            Write-Error "No payload executables found to sign in artifacts/windows/bin."
            exit 1
          }
          foreach ($exe in $executables) {
            signtool sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /f "$env:CERT_PATH" /p "$env:SIGN_CERT_PASSWORD" $exe.FullName
          }

      - name: Download latest release assets for delta generation
        shell: pwsh
        continue-on-error: true
        run: |
          $env:PATH += ";$env:USERPROFILE\\.dotnet\\tools"
          vpk download github `
            --repoUrl https://github.com/${{ github.repository }} `
            --channel ${{ steps.version.outputs.channel }} `
            --outputDir artifacts/windows/velopack `
            --token $env:GITHUB_TOKEN

      - name: Skip if this version is already published
        id: skipcheck
        shell: pwsh
        run: |
          # Re-running this workflow against an existing tag (e.g. after
          # a force-push to refs/tags/vX.Y.Z) would otherwise fail with
          # "There is a release in the selected channel which is equal or
          # greater to the current version" because vpk download just
          # pulled the existing full.nupkg. Detect and skip cleanly.
          $existing = Get-ChildItem artifacts/windows/velopack `
            -Filter "*-${{ steps.version.outputs.version }}-${{ steps.version.outputs.channel }}-full.nupkg" `
            -ErrorAction SilentlyContinue
          if ($existing) {
            Write-Host "::notice::Version ${{ steps.version.outputs.version }} is already published; skipping pack/sign/upload."
            "skip=true" >> $env:GITHUB_OUTPUT
          } else {
            "skip=false" >> $env:GITHUB_OUTPUT
          }

      - name: Create Velopack packages
        if: ${{ steps.skipcheck.outputs.skip != 'true' }}
        shell: pwsh
        env:
          SIGN_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGN_CERT_PASSWORD }}
        run: |
          $env:PATH += ";$env:USERPROFILE\\.dotnet\\tools"
          $args = @(
            "pack",
            "--packId", "Deluno",
            "--packVersion", "${{ steps.version.outputs.version }}",
            "--packDir", "artifacts/windows/bin",
            "--mainExe", "Deluno.exe",
            "--packTitle", "Deluno",
            "--icon", "installer/deluno.ico",
            "--channel", "${{ steps.version.outputs.channel }}",
            "--runtime", "win-x64",
            "--outputDir", "artifacts/windows/velopack"
          )
          if (-not [string]::IsNullOrWhiteSpace($env:CERT_PATH)) {
            $signParams = "/fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /f `"$env:CERT_PATH`" /p `"$env:SIGN_CERT_PASSWORD`""
            $args += @("--signParams", $signParams)
          }
          & vpk @args

      - name: Sign installer outputs
        if: ${{ env.CERT_PATH != '' && steps.skipcheck.outputs.skip != 'true' }}
        shell: pwsh
        env:
          SIGN_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGN_CERT_PASSWORD }}
        run: |
          Get-ChildItem artifacts/windows/velopack -Filter "*Setup*.exe" | ForEach-Object {
            signtool sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /f "$env:CERT_PATH" /p "$env:SIGN_CERT_PASSWORD" $_.FullName
          }

      # After signing: signtool rewrites Setup.exe, so a hash taken earlier would not match the file people
      # download.
      - name: Create portable zip and hashes
        if: ${{ steps.skipcheck.outputs.skip != 'true' }}
        shell: pwsh
        run: |
          $zipName = "Deluno-${{ steps.version.outputs.version }}-win-x64-portable.zip"
          $zipPath = Join-Path "artifacts/windows/velopack" $zipName
          if (Test-Path $zipPath) {
            Remove-Item $zipPath -Force
          }
          Compress-Archive -Path "artifacts/windows/bin/*" -DestinationPath $zipPath -CompressionLevel Optimal

          $hashTargets = @()
          $hashTargets += (Get-ChildItem artifacts/windows/velopack -Filter "*Setup*.exe" -File -ErrorAction SilentlyContinue).FullName
          $hashTargets += (Get-ChildItem artifacts/windows/velopack -Filter "*.nupkg" -File -ErrorAction SilentlyContinue).FullName
          $hashTargets += (Get-ChildItem artifacts/windows/velopack -Filter "releases.*.json" -File -ErrorAction SilentlyContinue).FullName
          $hashTargets += (Get-ChildItem artifacts/windows/velopack -Filter "RELEASES*" -File -ErrorAction SilentlyContinue).FullName
          $hashTargets += $zipPath
          $hashTargets = $hashTargets | Select-Object -Unique

          $hashFile = "artifacts/windows/velopack/SHA256SUMS.txt"
          if (Test-Path $hashFile) {
            Remove-Item $hashFile -Force
          }
          New-Item -Path $hashFile -ItemType File -Force | Out-Null
          foreach ($target in $hashTargets) {
            if (Test-Path $target) {
              $hash = (Get-FileHash $target -Algorithm SHA256).Hash.ToLowerInvariant()
              $name = Split-Path $target -Leaf
              Add-Content -Path $hashFile -Value "$hash  $name"
            }
          }

      - name: Verify required Velopack outputs
        if: ${{ steps.skipcheck.outputs.skip != 'true' }}
        shell: pwsh
        run: |
          $isPreOne = "${{ steps.version.outputs.version }}".StartsWith("0.")
          $setup = Get-ChildItem artifacts/windows/velopack -Filter "*Setup*.exe" -ErrorAction SilentlyContinue
          $full = Get-ChildItem artifacts/windows/velopack -Filter "*full.nupkg" -ErrorAction SilentlyContinue
          $releaseJson = Get-ChildItem artifacts/windows/velopack -Filter "releases.*.json" -ErrorAction SilentlyContinue
          $releaseIndex = Get-ChildItem artifacts/windows/velopack -Filter "RELEASES*" -ErrorAction SilentlyContinue
          if (-not $setup) { Write-Error "Missing setup executable output."; exit 1 }
          if (-not $isPreOne) {
            if (-not $full) { Write-Error "Missing full nupkg output."; exit 1 }
            if (-not $releaseJson) { Write-Error "Missing releases.<channel>.json output."; exit 1 }
            if (-not $releaseIndex) { Write-Error "Missing RELEASES channel index output."; exit 1 }
          }

      # Only meaningful when something was actually signed. Verifying an
      # unsigned build against a signature requirement is how a release that
      # was never going to be signed fails at the last step.
      - name: Verify signatures
        if: ${{ env.CERT_PATH != '' && steps.skipcheck.outputs.skip != 'true' }}
        shell: pwsh
        run: |
          $files = @()
          $files += (Get-ChildItem artifacts/windows/bin -Filter "*.exe" -File).FullName
          $files += (Get-ChildItem artifacts/windows/velopack -Filter "*Setup*.exe" -File).FullName
          $files = $files | Select-Object -Unique
          if (-not $files) {
            Write-Error "No executable files found for signature verification."
            exit 1
          }
          foreach ($file in $files) {
            $sig = Get-AuthenticodeSignature $file
            if ($sig.Status -ne "Valid") {
              Write-Error "Invalid or missing signature on $file (status: $($sig.Status))."
              exit 1
            }
          }

      - name: Upload Velopack artifacts
        if: ${{ steps.skipcheck.outputs.skip != 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-velopack
          path: |
            artifacts/windows/velopack/*.exe
            artifacts/windows/velopack/*.nupkg
            artifacts/windows/velopack/*.zip
            artifacts/windows/velopack/releases.*.json
            artifacts/windows/velopack/RELEASES*
            artifacts/windows/velopack/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7

  # The linux/amd64 image (publish-docker adds arm64 and starts both), built and checked without credentials. Its layers go to this run's GitHub Actions cache
  # (not a registry), so publish-docker rebuilds from them instead of from scratch.
  docker-candidate:
    name: Docker release candidate
    runs-on: ubuntu-latest
    # Observed 4 to 5 minutes for the build, scan and start.
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      CANDIDATE: deluno-release-candidate:${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build unpushed Docker release candidate
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          load: true
          platforms: linux/amd64
          push: false
          tags: ${{ env.CANDIDATE }}
          cache-from: type=gha,scope=deluno-release-amd64
          cache-to: type=gha,mode=max,scope=deluno-release-amd64,ignore-error=true

      # Before the candidate ever runs: a known HIGH or CRITICAL vulnerability with a fix already available blocks the
      # release outright. ignore-unfixed, because failing on something no upstream fix exists for yet would just
      # make every release wait on an unrelated CVE.
      - name: Trivy scan of Docker release candidate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.CANDIDATE }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Start unpushed Docker release candidate
        run: |
          docker rm -f deluno-release-candidate >/dev/null 2>&1 || true
          docker run -d --name deluno-release-candidate -p 18080:8080 "$CANDIDATE"
          for _ in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:18080/api/health/ready >/dev/null 2>&1; then
              echo "The release candidate answered ready."
              exit 0
            fi
            sleep 2
          done
          docker logs deluno-release-candidate || true
          echo "::error::The release candidate did not answer /api/health/ready within 120 seconds."
          exit 1

      - name: Cleanup unpushed Docker release candidate
        if: always()
        run: docker rm -f deluno-release-candidate >/dev/null 2>&1 || true

  # The GitHub Release, from what the windows job built. It does not wait for the Docker jobs, and nothing in it
  # touches the registry. It is the only job allowed to write to the repository.
  publish-windows:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    # Observed under a minute.
    timeout-minutes: 15
    # Without ci-passed a commit CI never passed could ship; without golden-path, one the golden path never passed;
    # without windows there is no installer to release.
    needs: [ci-passed, golden-path, validate, windows]
    permissions:
      contents: write
      # For actions/attest-build-provenance, which signs over OIDC (id-token) and records the attestation against
      # this repository (attestations). Used only when the repository variable ATTEST_PROVENANCE is "true".
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Extract version
        id: version
        run: |
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Docker image name
        id: image
        run: echo "name=${REGISTRY}/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Download windows artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-velopack
          path: release-assets

      - name: Validate release assets
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          PRE_ONE=false
          if [[ "$VERSION" == 0.* ]]; then PRE_ONE=true; fi
          ls -lah release-assets
          test -n "$(ls -1 release-assets/*Setup*.exe 2>/dev/null)" || { echo "Missing setup executable"; exit 1; }
          test -n "$(ls -1 release-assets/*portable.zip 2>/dev/null)" || { echo "Missing portable zip"; exit 1; }
          test -f "release-assets/SHA256SUMS.txt" || { echo "Missing SHA256SUMS.txt"; exit 1; }
          if [[ "$PRE_ONE" != "true" ]]; then
            test -n "$(ls -1 release-assets/*full.nupkg 2>/dev/null)" || { echo "Missing full package"; exit 1; }
            test -n "$(ls -1 release-assets/releases.*.json 2>/dev/null)" || { echo "Missing release index"; exit 1; }
          fi

      # Artifact attestations are free on a public repository. On a private one they need GitHub Enterprise Cloud, so
      # they are off until the repository goes public: set the repository variable ATTEST_PROVENANCE to "true" then.
      # After SHA256SUMS exists, so the attestation covers the exact bytes people download.
      - name: Attest provenance of the Windows release files
        if: ${{ vars.ATTEST_PROVENANCE == 'true' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release-assets/*.exe
            release-assets/*.nupkg
            release-assets/*.zip
            release-assets/releases.*.json
            release-assets/RELEASES*
            release-assets/SHA256SUMS.txt

      - name: Write the release body
        run: |
          {
            echo "## Deluno ${{ steps.version.outputs.tag }}"
            echo
            # The same early-days notice goes into every release (.github/release-notice.md).
            cat .github/release-notice.md
            echo
            cat <<'EOF'
          ### Windows

          Download and run the Velopack setup executable. Existing installs update in-place with delta packages.
          If Setup is blocked in your environment, use the portable zip build and verify SHA256SUMS.txt.
          If Microsoft Defender reports a false positive, submit the file URL for review: https://www.microsoft.com/en-us/wdsi/AppRepSubmission

          EOF
            echo "### Docker"
            echo
            echo "\`${{ steps.image.outputs.name }}:${{ steps.version.outputs.version }}\`"
            echo
            echo "### What's changed"
            echo
            echo "See [commit history](https://github.com/${{ github.repository }}/commits/${{ steps.version.outputs.tag }})."
          } > release-body.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Deluno ${{ steps.version.outputs.tag }}
          draft: false
          prerelease: ${{ startsWith(steps.version.outputs.version, '0.') || contains(steps.version.outputs.tag, '-') }}
          body_path: release-body.md
          files: |
            release-assets/*.exe
            release-assets/*.nupkg
            release-assets/*.zip
            release-assets/releases.*.json
            release-assets/RELEASES*
            release-assets/SHA256SUMS.txt

  # The container image, rebuilt from the layers the docker-candidate job cached. It does not wait for the Windows
  # build, and nothing in it touches the Releases page. It is the only job allowed to write packages and log in to the registry.
  publish-docker:
    name: Publish Docker image
    runs-on: ubuntu-latest
    # Observed under five minutes for the push and the smoke.
    timeout-minutes: 30
    # Without ci-passed a commit CI never passed could ship; without docker-candidate an image that was never built,
    # scanned and started unpushed could reach ghcr.
    needs: [ci-passed, golden-path, validate, docker-candidate]
    permissions:
      contents: read
      packages: write
      # For actions/attest-build-provenance (OIDC signing, then recording the attestation next to the image in ghcr).
      # Used only when the repository variable ATTEST_PROVENANCE is "true".
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # A version with a hyphen (1.0.0-rc.30) is a pre-release: it moves no moving tag.
      - name: Extract version
        id: version
        run: |
          plain="${TAG#v}"
          echo "plain=$plain" >> "$GITHUB_OUTPUT"
          if [[ "$plain" == *-* ]]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi

      - name: Docker image name
        id: image
        run: echo "name=${REGISTRY}/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      # arm64 steps (the Dockerfile's last stage, and the start-up check below) run under emulation on the amd64 runner.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Registry credentials and public tags are not created until every job above has passed.
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The version tag is pushed first; metadata-action decides what the moving tags are (major.minor, and latest
      # for a release that is not a prerelease; a release candidate gets neither) and they are moved at the very end.
      - name: Image tags and labels (version)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}

      - name: Image tags (moving)
        id: moving
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: |
            latest=auto
          tags: |
            type=semver,pattern={{major}}.{{minor}}

      # Rebuilt from the layers the docker-candidate job cached. Provenance and an SBOM travel with the image in the
      # registry.
      - name: Publish release Docker image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=deluno-release-amd64
          cache-to: type=gha,mode=max,scope=deluno-release-amd64,ignore-error=true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Attest provenance of the container image
        if: ${{ vars.ATTEST_PROVENANCE == 'true' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Verify pushed digest is addressable
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: docker buildx imagetools inspect "${IMAGE_NAME}@${IMAGE_DIGEST}"

      - name: Smoke test published Docker image
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          docker rm -f deluno-release-smoke >/dev/null 2>&1 || true
          docker run -d --name deluno-release-smoke -p 18081:8080 "${IMAGE_NAME}@${IMAGE_DIGEST}"
          for _ in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:18081/api/health/ready >/dev/null 2>&1; then
              echo "The published image answered ready."
              exit 0
            fi
            sleep 2
          done
          docker logs deluno-release-smoke || true
          echo "::error::The published image did not answer /api/health/ready within 120 seconds."
          exit 1

      # The arm64 image from the same digest, started under emulation: a Synology, a Raspberry Pi or an Apple-silicon host
      # gets an image that starts and answers ready, not one that was only built.
      - name: Smoke test published arm64 Docker image
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          docker rm -f deluno-release-smoke-arm64 >/dev/null 2>&1 || true
          docker run -d --platform linux/arm64 --name deluno-release-smoke-arm64 -p 18082:8080 "${IMAGE_NAME}@${IMAGE_DIGEST}"
          for _ in $(seq 1 120); do
            if curl --fail --silent --show-error http://127.0.0.1:18082/api/health/ready >/dev/null 2>&1; then
              echo "The published arm64 image answered ready."
              exit 0
            fi
            sleep 3
          done
          docker logs deluno-release-smoke-arm64 || true
          echo "::error::The published arm64 image did not answer /api/health/ready within 360 seconds."
          exit 1

      - name: Cleanup Docker smoke container
        if: always()
        run: docker rm -f deluno-release-smoke deluno-release-smoke-arm64 >/dev/null 2>&1 || true

      # Last, so a moving tag only ever names an image that passed its smoke. A copy of the version's manifest,
      # provenance and SBOM included, nothing rebuilt. A release candidate moves none.
      - name: Move the moving image tags
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          MOVING_TAGS: ${{ steps.moving.outputs.tags }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          if [ "$PRERELEASE" = "true" ]; then
            echo "A release candidate moves no moving tags."
            exit 0
          fi
          if [ -z "${MOVING_TAGS}" ]; then
            echo "No moving tags for this version."
            exit 0
          fi
          for moving in ${MOVING_TAGS}; do
            docker buildx imagetools create --tag "${moving}" "${IMAGE_NAME}@${IMAGE_DIGEST}"
          done
