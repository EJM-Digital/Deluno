name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Windows Velopack packages
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Extract version
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart('v')
          # 0.x and explicitly prerelease-tagged builds are validation/preview
          # candidates. They must be packed onto their own feed, rather than
          # allowing a fresh install to jump to the stable release channel.
          $channel = if ($version.StartsWith("0.") -or $version -match "-(rc|beta|preview)([.-]|$)") { "rc" } else { "stable" }
          echo "version=$version" >> $env:GITHUB_OUTPUT
          echo "tag=$tag" >> $env:GITHUB_OUTPUT
          echo "channel=$channel" >> $env:GITHUB_OUTPUT

      - name: Install npm dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build:web

      - name: Publish Deluno.Tray (win-x64)
        shell: pwsh
        run: |
          # A release runner is normally clean, but packaging must never pick
          # up a removed component from a reused workspace or cached output.
          Remove-Item -LiteralPath "artifacts/windows/bin" -Recurse -Force -ErrorAction SilentlyContinue
          dotnet publish apps/windows-tray/Deluno.Tray.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=false `
            -p:Version=${{ steps.version.outputs.version }} `
            -p:DelunoUpdateChannel=${{ steps.version.outputs.channel }} `
            -o artifacts/windows/bin

      # Through scripts/fetch-ffmpeg.ps1, which is the same call the lab publish
      # makes. This step used to download its own copy, and the two had drifted
      # in three ways that all reached the shipped installer:
      #
      #   * it took the GPL build. fetch-ffmpeg.ps1 takes LGPL shared, and says
      #     why: the GPL builds cannot ship inside a product.
      #   * it took master-latest, so two publishes of the same commit produced
      #     different bytes. The script pins a release line.
      #   * it copied only ffprobe.exe. Subtitle timing sync needs ffmpeg.exe
      #     and cannot exist without it, so that feature was dark on every
      #     installed copy while working on the lab - which is exactly the shape
      #     of bug nobody finds, because the environment that could see it was
      #     the one that did not have the problem.
      - name: Bundle FFmpeg
        shell: pwsh
        run: |
          ./scripts/fetch-ffmpeg.ps1 -RuntimeIdentifier win-x64
          $source = "tools/ffmpeg/win-x64"
          $target = "artifacts/windows/bin/tools/ffmpeg"
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          Copy-Item -Path "$source/*" -Destination $target -Recurse -Force

          # The resolver looks in tools/ffmpeg before it looks loose beside the
          # executable, so both are found. Assert it rather than trust it: a
          # silently absent binary is how this went unnoticed the first time.
          foreach ($required in @("ffmpeg.exe", "ffprobe.exe")) {
            $path = Join-Path $target $required
            if (-not (Test-Path $path)) { Write-Error "$required is missing from the package"; exit 1 }
            Write-Host "bundled $required ($([math]::Round((Get-Item $path).Length / 1MB, 1)) MB)"
          }

      - name: Bundle UnRAR.exe (rarlab; extraction-only is license-clean)
        shell: pwsh
        run: |
          # UnRAR's source license forbids using the source to build a competing
          # archiver, but extraction-only use of the official binary is permitted.
          # See tools/unrar/license.txt for the upstream license text.
          $url = "https://www.rarlab.com/rar/unrarw64.exe"
          $self = "$env:RUNNER_TEMP\\unrarw64.exe"
          Invoke-WebRequest -Uri $url -OutFile $self -UseBasicParsing
          # The downloaded file is a self-extracting archive. Extract via the
          # built-in /e silent option then locate UnRAR.exe.
          $extractDir = "$env:RUNNER_TEMP\\unrar-extract"
          New-Item -ItemType Directory -Force -Path $extractDir | Out-Null
          & $self -y -d"$extractDir"
          $unrar = Get-ChildItem $extractDir -Recurse -Filter "UnRAR.exe" | Select-Object -First 1
          if (-not $unrar) {
            # Fallback: some builds need a different extraction approach; skip
            # bundling and let the user install separately. Surface a warning.
            Write-Warning "UnRAR.exe extraction failed; users will need to install unrar themselves."
            exit 0
          }
          New-Item -ItemType Directory -Force -Path "artifacts/windows/bin/tools/unrar" | Out-Null
          Copy-Item $unrar.FullName "artifacts/windows/bin/tools/unrar/UnRAR.exe"
          # Upstream license shipped alongside.
          $license = Get-ChildItem $extractDir -Recurse -Filter "license.txt" | Select-Object -First 1
          if ($license) { Copy-Item $license.FullName "artifacts/windows/bin/tools/unrar/license.txt" }

      - name: Install Velopack CLI
        shell: pwsh
        run: dotnet tool install -g vpk --version 0.0.1298

      - name: Prepare code signing certificate
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace("${{ secrets.WINDOWS_SIGN_CERT_BASE64 }}") -or [string]::IsNullOrWhiteSpace("${{ secrets.WINDOWS_SIGN_CERT_PASSWORD }}")) {
            Write-Host "Signing secrets not configured; continuing unsigned for this run."
            exit 0
          }
          $bytes = [Convert]::FromBase64String("${{ secrets.WINDOWS_SIGN_CERT_BASE64 }}")
          $path = "$env:RUNNER_TEMP\\codesign.pfx"
          [IO.File]::WriteAllBytes($path, $bytes)
          "CERT_PATH=$path" >> $env:GITHUB_ENV

      # Deluno ships unsigned, by decision: a code-signing certificate is a
      # recurring cost this project is not paying, and the consequence -
      # SmartScreen warning on first install - is accepted and documented for
      # users rather than hidden.
      #
      # This step used to hard-fail any 1.x build without a certificate, which
      # meant no 1.x release could be produced at all once that decision was
      # made. Signing still happens automatically if the secrets are ever
      # added; it is simply no longer a gate.
      - name: Report signing status
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CERT_PATH)) {
            Write-Host "::warning::Publishing UNSIGNED. Windows SmartScreen will warn on first install. See docs/ga-release-checklist.md."
          } else {
            Write-Host "Code-signing certificate is present; artifacts will be signed."
          }

      - name: Sign payload executables
        if: ${{ env.CERT_PATH != '' }}
        shell: pwsh
        run: |
          $executables = Get-ChildItem artifacts/windows/bin -Filter "*.exe" -File -ErrorAction SilentlyContinue
          if (-not $executables) {
            Write-Error "No payload executables found to sign in artifacts/windows/bin."
            exit 1
          }
          foreach ($exe in $executables) {
            signtool sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /f "$env:CERT_PATH" /p "${{ secrets.WINDOWS_SIGN_CERT_PASSWORD }}" $exe.FullName
          }

      - name: Download latest release assets for delta generation
        shell: pwsh
        continue-on-error: true
        run: |
          $env:PATH += ";$env:USERPROFILE\\.dotnet\\tools"
          vpk download github `
            --repoUrl https://github.com/${{ github.repository }} `
            --channel ${{ steps.version.outputs.channel }} `
            --outputDir artifacts/windows/velopack `
            --token ${{ secrets.GITHUB_TOKEN }}

      - name: Skip if this version is already published
        id: skipcheck
        shell: pwsh
        run: |
          # Re-running this workflow against an existing tag (e.g. after
          # a force-push to refs/tags/vX.Y.Z) would otherwise fail with
          # "There is a release in the selected channel which is equal or
          # greater to the current version" because vpk download just
          # pulled the existing full.nupkg. Detect and skip cleanly.
          $existing = Get-ChildItem artifacts/windows/velopack `
            -Filter "*-${{ steps.version.outputs.version }}-${{ steps.version.outputs.channel }}-full.nupkg" `
            -ErrorAction SilentlyContinue
          if ($existing) {
            Write-Host "::notice::Version ${{ steps.version.outputs.version }} is already published; skipping pack/sign/upload."
            "skip=true" >> $env:GITHUB_OUTPUT
          } else {
            "skip=false" >> $env:GITHUB_OUTPUT
          }

      - name: Create Velopack packages
        if: ${{ steps.skipcheck.outputs.skip != 'true' }}
        shell: pwsh
        env:
          SIGN_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGN_CERT_PASSWORD }}
        run: |
          $env:PATH += ";$env:USERPROFILE\\.dotnet\\tools"
          $args = @(
            "pack",
            "--packId", "Deluno",
            "--packVersion", "${{ steps.version.outputs.version }}",
            "--packDir", "artifacts/windows/bin",
            "--mainExe", "Deluno.exe",
            "--packTitle", "Deluno",
            "--icon", "installer/deluno.ico",
            "--channel", "${{ steps.version.outputs.channel }}",
            "--runtime", "win-x64",
            "--outputDir", "artifacts/windows/velopack"
          )
          if (-not [string]::IsNullOrWhiteSpace($env:CERT_PATH)) {
            $signParams = "/fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /f `"$env:CERT_PATH`" /p `"$env:SIGN_CERT_PASSWORD`""
            $args += @("--signParams", $signParams)
          }
          & vpk @args

      - name: Sign installer outputs
        if: ${{ env.CERT_PATH != '' && steps.skipcheck.outputs.skip != 'true' }}
        shell: pwsh
        run: |
          Get-ChildItem artifacts/windows/velopack -Filter "*Setup*.exe" | ForEach-Object {
            signtool sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /f "$env:CERT_PATH" /p "${{ secrets.WINDOWS_SIGN_CERT_PASSWORD }}" $_.FullName
          }

      - name: Create portable zip and hashes
        if: ${{ steps.skipcheck.outputs.skip != 'true' }}
        shell: pwsh
        run: |
          $zipName = "Deluno-${{ steps.version.outputs.version }}-win-x64-portable.zip"
          $zipPath = Join-Path "artifacts/windows/velopack" $zipName
          if (Test-Path $zipPath) {
            Remove-Item $zipPath -Force
          }
          Compress-Archive -Path "artifacts/windows/bin/*" -DestinationPath $zipPath -CompressionLevel Optimal

          $hashTargets = @()
          $hashTargets += (Get-ChildItem artifacts/windows/velopack -Filter "*Setup*.exe" -File -ErrorAction SilentlyContinue).FullName
          $hashTargets += (Get-ChildItem artifacts/windows/velopack -Filter "*.nupkg" -File -ErrorAction SilentlyContinue).FullName
          $hashTargets += (Get-ChildItem artifacts/windows/velopack -Filter "releases.*.json" -File -ErrorAction SilentlyContinue).FullName
          $hashTargets += (Get-ChildItem artifacts/windows/velopack -Filter "RELEASES*" -File -ErrorAction SilentlyContinue).FullName
          $hashTargets += $zipPath
          $hashTargets = $hashTargets | Select-Object -Unique

          $hashFile = "artifacts/windows/velopack/SHA256SUMS.txt"
          if (Test-Path $hashFile) {
            Remove-Item $hashFile -Force
          }
          New-Item -Path $hashFile -ItemType File -Force | Out-Null
          foreach ($target in $hashTargets) {
            if (Test-Path $target) {
              $hash = (Get-FileHash $target -Algorithm SHA256).Hash.ToLowerInvariant()
              $name = Split-Path $target -Leaf
              Add-Content -Path $hashFile -Value "$hash  $name"
            }
          }

      - name: Verify required Velopack outputs
        if: ${{ steps.skipcheck.outputs.skip != 'true' }}
        shell: pwsh
        run: |
          $isPreOne = "${{ steps.version.outputs.version }}".StartsWith("0.")
          $setup = Get-ChildItem artifacts/windows/velopack -Filter "*Setup*.exe" -ErrorAction SilentlyContinue
          $full = Get-ChildItem artifacts/windows/velopack -Filter "*full.nupkg" -ErrorAction SilentlyContinue
          $releaseJson = Get-ChildItem artifacts/windows/velopack -Filter "releases.*.json" -ErrorAction SilentlyContinue
          $releaseIndex = Get-ChildItem artifacts/windows/velopack -Filter "RELEASES*" -ErrorAction SilentlyContinue
          if (-not $setup) { Write-Error "Missing setup executable output."; exit 1 }
          if (-not $isPreOne) {
            if (-not $full) { Write-Error "Missing full nupkg output."; exit 1 }
            if (-not $releaseJson) { Write-Error "Missing releases.<channel>.json output."; exit 1 }
            if (-not $releaseIndex) { Write-Error "Missing RELEASES channel index output."; exit 1 }
          }

      # Only meaningful when something was actually signed. Verifying an
      # unsigned build against a signature requirement is how a release that
      # was never going to be signed fails at the last step.
      - name: Verify signatures
        if: ${{ env.CERT_PATH != '' && steps.skipcheck.outputs.skip != 'true' }}
        shell: pwsh
        run: |
          $files = @()
          $files += (Get-ChildItem artifacts/windows/bin -Filter "*.exe" -File).FullName
          $files += (Get-ChildItem artifacts/windows/velopack -Filter "*Setup*.exe" -File).FullName
          $files = $files | Select-Object -Unique
          if (-not $files) {
            Write-Error "No executable files found for signature verification."
            exit 1
          }
          foreach ($file in $files) {
            $sig = Get-AuthenticodeSignature $file
            if ($sig.Status -ne "Valid") {
              Write-Error "Invalid or missing signature on $file (status: $($sig.Status))."
              exit 1
            }
          }

      - name: Upload Velopack artifacts
        if: ${{ steps.skipcheck.outputs.skip != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-velopack
          path: |
            artifacts/windows/velopack/*.exe
            artifacts/windows/velopack/*.nupkg
            artifacts/windows/velopack/*.zip
            artifacts/windows/velopack/releases.*.json
            artifacts/windows/velopack/RELEASES*
            artifacts/windows/velopack/SHA256SUMS.txt
          retention-days: 7

  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [windows]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version
        id: version
        run: |
          TAG="${{ github.ref_name }}"
          echo "version=${TAG#v}" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Download windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-velopack
          path: release-assets

      - name: Validate release assets
        run: |
          PRE_ONE=false
          if [[ "${{ steps.version.outputs.version }}" == 0.* ]]; then PRE_ONE=true; fi
          ls -lah release-assets
          test -n "$(ls -1 release-assets/*Setup*.exe 2>/dev/null)" || { echo "Missing setup executable"; exit 1; }
          test -n "$(ls -1 release-assets/*portable.zip 2>/dev/null)" || { echo "Missing portable zip"; exit 1; }
          test -f "release-assets/SHA256SUMS.txt" || { echo "Missing SHA256SUMS.txt"; exit 1; }
          if [[ "$PRE_ONE" != "true" ]]; then
            test -n "$(ls -1 release-assets/*full.nupkg 2>/dev/null)" || { echo "Missing full package"; exit 1; }
            test -n "$(ls -1 release-assets/releases.*.json 2>/dev/null)" || { echo "Missing release index"; exit 1; }
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Deluno ${{ steps.version.outputs.tag }}
          draft: false
          prerelease: ${{ startsWith(steps.version.outputs.version, '0.') || contains(steps.version.outputs.tag, '-') }}
          body: |
            ## Deluno ${{ steps.version.outputs.tag }}

            ### Windows

            Download and run the Velopack setup executable. Existing installs update in-place with delta packages.
            If Setup is blocked in your environment, use the portable zip build and verify SHA256SUMS.txt.
            If Microsoft Defender reports a false positive, submit the file URL for review: https://www.microsoft.com/en-us/wdsi/AppRepSubmission


            ### What's changed

            See [commit history](https://github.com/${{ github.repository }}/commits/${{ steps.version.outputs.tag }}).
          files: |
            release-assets/*.exe
            release-assets/*.nupkg
            release-assets/*.zip
            release-assets/releases.*.json
            release-assets/RELEASES*
            release-assets/SHA256SUMS.txt
