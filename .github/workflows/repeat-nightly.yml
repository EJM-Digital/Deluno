# Nightly repeat of every suite (issue 1273, docs/testing/STRATEGY.md). Each backend test project, the web unit tests, the
# Playwright smoke shards, the Node tests (scripts, metadata gateway, sdk) and the scenario suite's own offline checks run
# several times in a row on the same build. A test that passes on one run and fails on another fails the night and opens a defect
# issue. There is no retry and no quarantine: the first failing run fails the job. The end-to-end groups (installer, Windows
# and Linux stacks) are not repeated here: each is a many-minute scenario run, and the scenario suite on the golden VM is their
# repeat before every tag.
#
# Runners are GitHub-hosted, free for a public repository.
name: Repeat suites (nightly)

on:
  schedule:
    # Every night, 15:00 UTC: a quiet hour.
    - cron: "0 15 * * *"
  workflow_dispatch:
    inputs:
      repeats:
        description: "How many times each suite runs in a row"
        default: "5"
        required: false
      smoke_repeats:
        description: "How many times each Playwright smoke shard runs in a row (each run is about 17 minutes)"
        default: "3"
        required: false

concurrency:
  group: repeat-nightly
  cancel-in-progress: false

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  REPEATS: ${{ inputs.repeats || '5' }}
  SMOKE_REPEATS: ${{ inputs.smoke_repeats || '3' }}

jobs:
  backend:
    name: ${{ matrix.project }}
    runs-on: ${{ vars.DELUNO_LINUX_RUNS_ON && fromJSON(vars.DELUNO_LINUX_RUNS_ON) || 'ubuntu-latest' }}
    # Five runs of the slowest project plus its build; the backend job in ci.yml has 90 minutes for one run of all of them.
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        project:
          - Deluno.Integrations.Tests
          - Deluno.Movies.Tests
          - Deluno.Persistence.Tests
          - Deluno.Platform.Tests
          - Deluno.Series.Tests
          - Deluno.Tray.Tests
          - Deluno.Worker.Tests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      # Several runners share one machine, and a fixed /tmp folder made by one runner's user is closed to the next
      # (the 20 October night failed thousands of times on "Permission denied"). Each job gets its own temp folder.
      - name: Use this job's own temp folder
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Build Release once
        run: dotnet build tests/${{ matrix.project }} -c Release

      - name: Run the suite ${{ env.REPEATS }} times in a row, no retry
        shell: bash
        run: |
          for run in $(seq 1 "$REPEATS"); do
            echo "::group::Run $run of $REPEATS"
            dotnet test tests/${{ matrix.project }} -c Release --no-build
            echo "::endgroup::"
          done

  web:
    name: Web unit tests
    runs-on: ${{ vars.DELUNO_LINUX_RUNS_ON && fromJSON(vars.DELUNO_LINUX_RUNS_ON) || 'ubuntu-latest' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install the pinned packages
        run: npm ci

      - name: Run the suite ${{ env.REPEATS }} times in a row, no retry
        shell: bash
        run: |
          for run in $(seq 1 "$REPEATS"); do
            echo "::group::Run $run of $REPEATS"
            npm run test:unit:web
            echo "::endgroup::"
          done

  node:
    name: Node tests (scripts, metadata gateway, sdk)
    runs-on: ${{ vars.DELUNO_LINUX_RUNS_ON && fromJSON(vars.DELUNO_LINUX_RUNS_ON) || 'ubuntu-latest' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install the pinned packages
        run: npm ci

      - name: Use this job's own temp folder
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"

      # platform-docker.test.mjs starts the Deluno image, which only the image job builds.
      - name: Run the three Node suites ${{ env.REPEATS }} times in a row, no retry
        shell: bash
        run: |
          for run in $(seq 1 "$REPEATS"); do
            echo "::group::Run $run of $REPEATS"
            node --test $(find scripts -name '*.test.mjs' ! -name platform-docker.test.mjs | sort)
            (cd services/metadata-gateway && node --test)
            node --test sdk/typescript/tests/delunoclient.test.mjs
            echo "::endgroup::"
          done

  scenario-suite-checks:
    name: Scenario suite offline checks
    # Windows PowerShell 5.1 is part of what the script checks, so it runs on Windows.
    runs-on: ${{ vars.DELUNO_WINDOWS_RUNS_ON && fromJSON(vars.DELUNO_WINDOWS_RUNS_ON) || 'windows-latest' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run the checks ${{ env.REPEATS }} times in a row, no retry
        shell: powershell
        run: |
          for ($run = 1; $run -le [int]$env:REPEATS; $run++) {
            Write-Host "::group::Run $run of $env:REPEATS"
            & powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/golden-path/Test-ScenarioSuite.ps1
            if ($LASTEXITCODE -ne 0) { throw "Run $run failed" }
            Write-Host "::endgroup::"
          }

  smoke:
    name: Frontend smoke (${{ matrix.shard }})
    runs-on: ${{ vars.DELUNO_LINUX_RUNS_ON && fromJSON(vars.DELUNO_LINUX_RUNS_ON) || 'ubuntu-latest' }}
    # Three runs of a shard (about 17 minutes each) plus the build and setup.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/3", "2/3", "3/3"]
    env:
      PLAYWRIGHT_HTML_OPEN: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Use this job's own temp folder
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Restore backend dependencies
        run: dotnet restore Deluno.slnx

      - name: Install the pinned packages
        run: npm ci

      - name: Install the browser
        working-directory: apps/web
        # --with-deps installs operating-system packages with sudo: only on a GitHub-hosted runner.
        run: npx playwright install ${{ runner.environment == 'github-hosted' && '--with-deps' || '' }} chromium

      - name: Build the web app once
        run: npm run build:web

      - name: Run the shard ${{ env.SMOKE_REPEATS }} times in a row, no retry
        shell: bash
        env:
          DELUNO_SMOKE_PREBUILT: "1"
        run: |
          for run in $(seq 1 "$SMOKE_REPEATS"); do
            echo "::group::Run $run of $SMOKE_REPEATS"
            npm --workspace apps/web run test:smoke -- --shard=${{ matrix.shard }} --reporter=dot
            echo "::endgroup::"
          done

  report:
    name: Open a defect issue for a flaky night
    needs: [backend, web, node, scenario-suite-checks, smoke]
    if: ${{ failure() }}
    runs-on: ${{ vars.DELUNO_LINUX_RUNS_ON && fromJSON(vars.DELUNO_LINUX_RUNS_ON) || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      # The REST API with curl: a self-hosted runner has no gh (the 20 October report step failed on "gh: command not found").
      - name: Open the issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          payload="{\"title\":\"A suite differed between nightly runs\",\"labels\":[\"testing: coverage\"],\"body\":\"The nightly repeat of the suites failed: a test failed on at least one of ${REPEATS} runs in a row on the same build. Find the failing test in ${RUN_URL}, reproduce it, and fix its cause. It is not retried or quarantined.\"}"
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "${{ github.api_url }}/repos/${{ github.repository }}/issues" -d "$payload"
