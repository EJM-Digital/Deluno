# Deluno CI: the backend build and tests, the web app, the browser smoke tests and the Docker image. Triggers: push
# to main, pull_request, workflow_dispatch.
#
# This is the shared CI standard (docs/ci-standard.md): `changes` turns the paths a change touches into one run_*
# flag per job, and each job runs only when its flag is true; a manual run runs everything. `ci-passed` needs every
# job and passes only when each job that was due passed and each job that was not due was skipped
# (scripts/ci-passed.mjs). It is the one check main's branch protection requires, and the one the release asks for
# on the tagged commit (scripts/verify-ci-for-release.mjs). scripts/check-release-workflow-gates.mjs checks that
# ci-passed needs every job here.
#
#   docs only (*.md, docs/**)   nothing but repo-checks runs
#   web only                    web-dist, web, e2e-smoke; no backend build or tests, no image
#   anything else               backend, web-dist, e2e-smoke (the smoke tests drive the real backend), and web-dist
#                               builds for them; web's own checks run when the web app changed
#   image paths                 docker (the Dockerfile, compose, the migrations, the README examples, or this file)
#   manual run only             windows-installer: the Windows installer of this commit, for the golden path
#   manual run, or a push whose version is untagged   e2e-linux: the end-to-end groups on Docker Compose (docs/exec-plans/active/PLAN-E2E-IN-CI.md)
#
# Work lands on main directly (James, 22 Sep 2026: one person works on Deluno, so no feature branches), which makes
# each push to main the one run. A pull request, if one is ever opened, is still checked; "Run workflow" re-runs by
# hand and runs every job.
name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  # A newer push supersedes a run still going: its tree contains the older one. Deluno's repository is private, so
  # a run nobody will read is minutes billed for nothing.
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run_backend: ${{ steps.flags.outputs.run_backend }}
      run_web_dist: ${{ steps.flags.outputs.run_web_dist }}
      run_web: ${{ steps.flags.outputs.run_web }}
      run_e2e_smoke: ${{ steps.flags.outputs.run_e2e_smoke }}
      run_docker: ${{ steps.flags.outputs.run_docker }}
      run_windows_installer: ${{ steps.flags.outputs.run_windows_installer }}
      run_e2e_linux: ${{ steps.flags.outputs.run_e2e_linux }}
      run_coverage: ${{ steps.flags.outputs.run_coverage }}
      run_mutation: ${{ steps.flags.outputs.run_mutation }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # some-with-excludes: a file counts for a filter when it matches one of the filter's patterns and none of its
      # `!` patterns. `code` is therefore "a change that is not a document"; `web` is "a web-app change that is not
      # a document", so `web_count == code_count` means every code change was in the web app.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          predicate-quantifier: some-with-excludes
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!docs/**'
            notes:
              # Shipped inside the build (Deluno.Api embeds it), so it is not a document to the backend.
              - 'RELEASE_NOTES.md'
            web:
              - 'apps/web/**'
              - 'sdk/typescript/**'
              - 'package.json'
              - 'package-lock.json'
              - '!**/*.md'
              - '!docs/**'
            docker:
              - 'Dockerfile'
              - '.dockerignore'
              - 'compose.yaml'
              - 'package.json'
              - 'package-lock.json'
              - 'scripts/test-docker-recovery.sh'
              - 'scripts/test-readme-docker-examples.sh'
              # The README's install examples are run against the image (test-readme-docker-examples.sh).
              - 'README.md'
              - 'src/**/Migrations/**'
              - '.github/workflows/ci.yml'
            workflows:
              - '.github/**'

      - name: Work out which jobs are due
        id: flags
        env:
          EVENT: ${{ github.event_name }}
          # Off until the first nightly mutation run has passed (docs/testing/STRATEGY.md, Measure 3).
          MUTATION_ON_PUSH: ${{ vars.DELUNO_MUTATION_ON_PUSH }}
          CODE: ${{ steps.filter.outputs.code }}
          CODE_COUNT: ${{ steps.filter.outputs.code_count }}
          NOTES: ${{ steps.filter.outputs.notes }}
          WEB: ${{ steps.filter.outputs.web }}
          WEB_COUNT: ${{ steps.filter.outputs.web_count }}
          DOCKER: ${{ steps.filter.outputs.docker }}
          WORKFLOWS: ${{ steps.filter.outputs.workflows }}
        run: |
          set -euo pipefail
          backend=false; web=false; smoke=false; docker=false; installer=false; e2e_linux=false; coverage=false; mutation=false
          if [ "$EVENT" = "workflow_dispatch" ]; then
            backend=true; web=true; smoke=true; docker=true; installer=true; e2e_linux=true
          else
            # Anything in the change that is not the web app (or a document) reaches the backend side: source,
            # tests, scripts, the tray, build props, the workflows themselves.
            if [ "$NOTES" = "true" ] || [ "${CODE_COUNT:-0}" -gt "${WEB_COUNT:-0}" ]; then backend=true; fi
            if [ "$WEB" = "true" ] || [ "$WORKFLOWS" = "true" ]; then web=true; fi
            if [ "$CODE" = "true" ] || [ "$NOTES" = "true" ]; then smoke=true; fi
            if [ "$DOCKER" = "true" ] || [ "$WORKFLOWS" = "true" ]; then docker=true; fi
          fi
          # The end-to-end groups run on a manual run and on a push whose version is not yet tagged: the work toward a
          # release (a tag v<version> is made only after they pass), not the pushes that follow it.
          if [ "$EVENT" != "workflow_dispatch" ]; then
            version="$(grep -oP '(?<=<Version>)[^<]+' Directory.Build.props | head -n 1)"
            if [ -n "$version" ] && [ -z "$(git ls-remote --tags origin "refs/tags/v$version")" ]; then e2e_linux=true; fi
          fi
          # Coverage is measured and held to its baseline only when both the backend and the web tests ran: the
          # ratchet compares whole-repository numbers, and a half report would look like a drop.
          if [ "$backend" = "true" ] && [ "$web" = "true" ]; then coverage=true; fi
          # Mutation runs on the changed files of a push or pull request. A manual run has no base to compare with
          # (the nightly workflow, mutation-nightly.yml, runs the full mutation).
          if [ "$MUTATION_ON_PUSH" = "true" ] && [ "$EVENT" != "workflow_dispatch" ] && [ "$CODE" = "true" ]; then mutation=true; fi
          # The smoke shards and the web checks both want the production web build.
          web_dist=false
          if [ "$web" = "true" ] || [ "$smoke" = "true" ]; then web_dist=true; fi
          {
            echo "run_backend=$backend"
            echo "run_web_dist=$web_dist"
            echo "run_web=$web"
            echo "run_e2e_smoke=$smoke"
            echo "run_docker=$docker"
            echo "run_windows_installer=$installer"
            echo "run_e2e_linux=$e2e_linux"
            echo "run_coverage=$coverage"
            echo "run_mutation=$mutation"
          } | tee -a "$GITHUB_OUTPUT"

  # Checks of the repository itself. Always runs: it takes seconds, and it is what keeps the workflows honest.
  repo-checks:
    name: Repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Actions are pinned, and every workflow has permissions and timeouts
        run: |
          node scripts/check-github-action-pins.mjs
          node scripts/check-workflow-hygiene.mjs

      - name: Release workflow gates and the ci-passed verdict
        run: |
          node scripts/check-release-workflow-gates.mjs
          node --test scripts/ci-passed.test.mjs

      - name: Validate agent-readable repository map
        shell: pwsh
        run: ./scripts/validate-agent-readiness.ps1

      - name: Nothing private is in a file outsiders read
        shell: pwsh
        run: ./scripts/check-public-exposure.ps1

      - name: No databases, keys, Python or .env files are tracked
        shell: pwsh
        run: ./scripts/check-tracked-files.ps1

      - name: No test builds an external app's reply inline, and the recorded-reply scrubber works
        run: |
          node scripts/check-recorded-replies.mjs
          node --test scripts/check-recorded-replies.test.mjs scripts/recorded-replies/scrub.test.mjs

      # The register is read against the code, and against the register as it was before this change: on a pull request the base
      # commit's, on a push to main the previous commit's. The gaps may not go up from that count (scripts/check-coverage-register.mjs),
      # so no gap count is kept in the file for pull requests to conflict on. A first push to a branch (an all-zero "before") and a force
      # push (a "before" that is no longer there) have nothing to compare with: the check says so and skips the ratchet.
      - name: The coverage register has a row for everything Deluno does, every proof it names exists, and the gaps have not gone up
        env:
          BEFORE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          node --test scripts/check-coverage-register.test.mjs
          node scripts/check-real-specs.mjs
          node --test scripts/check-real-specs.test.mjs
          args=(--report)
          if [ -z "$BEFORE" ] || [ -z "${BEFORE//0/}" ]; then
            echo "No earlier commit to compare the register with (a first push or a manual run): the gap ratchet is skipped."
          elif git fetch --no-tags --depth=1 origin "$BEFORE"; then
            args+=(--base FETCH_HEAD)
          else
            echo "The earlier commit $BEFORE cannot be fetched (a force push): the gap ratchet is skipped."
          fi
          node scripts/check-coverage-register.mjs "${args[@]}"

      - name: Upload the coverage register statistics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-register
          if-no-files-found: ignore
          retention-days: 7
          path: artifacts/coverage-register.md

      - name: Coverage exclusions have reasons, and the coverage merge and ratchet work
        run: |
          node scripts/check-coverage-ratchet.mjs
          node --test scripts/check-coverage-ratchet.test.mjs scripts/coverage/merge-coverage.test.mjs

      - name: The mutation tooling works, the configs are current, and the thresholds and equivalent-mutant list are valid
        run: |
          node scripts/mutation/gen-stryker-configs.mjs --check
          node scripts/check-mutation-ratchet.mjs
          node --test scripts/check-mutation-ratchet.test.mjs

      - name: The Windows icon is built from the current logo
        run: node scripts/check-windows-icon.mjs

  backend:
    name: Backend build and tests
    needs: changes
    if: ${{ needs.changes.outputs.run_backend == 'true' }}
    runs-on: ubuntu-latest
    # Observed 23 to 34 minutes (3 Oct 2026), 41 on 15 Oct, and more than 57 for the tests alone once the coverage work
    # added about 1,500 Persistence tests (15 Oct, run 38731946211 cancelled at the old 60). Splitting Persistence across
    # jobs is the lasting fix (Refs #1346); until then the job may take 90.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Restore backend dependencies
        run: dotnet restore Deluno.slnx

      - name: Build backend
        run: dotnet build Deluno.slnx --configuration Release --no-restore

      - name: Run backend tests
        if: ${{ needs.changes.outputs.run_coverage != 'true' }}
        shell: pwsh
        # The Timing tests hold an endpoint to a time budget; beside the rest of the suite a
        # busy runner made a 12 ms call take 633 ms (10 Oct 2026). They run on their own next,
        # exactly as scripts/gate.ps1 runs them.
        run: ./scripts/test-dotnet-serial.ps1 -Filter "Category!=Timing"

      # The same run, collecting line and branch coverage (coverlet) for every Deluno production assembly.
      - name: Run backend tests with coverage
        if: ${{ needs.changes.outputs.run_coverage == 'true' }}
        shell: pwsh
        run: ./scripts/test-dotnet-serial.ps1 -Filter "Category!=Timing" -Coverage

      - name: Run timing tests alone
        shell: pwsh
        run: dotnet test tests/Deluno.Persistence.Tests/Deluno.Persistence.Tests.csproj --configuration Release --no-build --no-restore --filter "Category=Timing" --logger "trx;LogFileName=timing-tests.trx"

      - name: Summarize backend test results
        if: always()
        run: node scripts/summarize-test-results.mjs trx tests "Backend tests"

      - name: Upload backend test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-test-results
          path: "**/TestResults/*.trx"
          if-no-files-found: ignore

      - name: Upload backend coverage
        if: ${{ needs.changes.outputs.run_coverage == 'true' && !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-dotnet
          path: tests/*/TestResults/*/coverage.cobertura.xml
          if-no-files-found: error
          retention-days: 7

  # The production web build, made once: the web checks and both smoke shards use this one (the smoke suite used to
  # build it again on every shard, and its web server built it a third time).
  web-dist:
    name: Web build
    needs: changes
    if: ${{ needs.changes.outputs.run_web_dist == 'true' }}
    runs-on: ubuntu-latest
    # Observed about 2.5 minutes.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      # Runs the web app's lint and its UI primitive, spacing, status and typography checks first (the `prebuild`
      # script), then the type check and the production bundle.
      - name: Build frontend
        run: npm run build:web

      - name: Upload web build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-dist
          path: apps/web/dist/
          if-no-files-found: error
          retention-days: 1

  web:
    name: Frontend quality
    needs: changes
    if: ${{ needs.changes.outputs.run_web == 'true' }}
    runs-on: ubuntu-latest
    # Observed about 6 minutes, 5 of them the unit tests.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Check for orphaned frontend modules
        working-directory: apps/web
        run: npm run check:orphans

      - name: Typecheck supported TypeScript SDK
        run: npm run typecheck:sdk

      - name: Run frontend unit tests
        if: ${{ needs.changes.outputs.run_coverage != 'true' }}
        run: npm run test:unit:web

      # The same run with v8 coverage (@vitest/coverage-v8 is a devDependency of apps/web).
      - name: Run frontend unit tests with coverage
        if: ${{ needs.changes.outputs.run_coverage == 'true' }}
        run: npm run test:unit:web:coverage

      - name: Upload frontend coverage
        if: ${{ needs.changes.outputs.run_coverage == 'true' && !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-web
          path: apps/web/coverage/lcov.info
          if-no-files-found: error
          retention-days: 7

  e2e-smoke:
    # Two shards, not four: each shard repeats about 75 seconds of setup, and the suite is two-thirds of a pull
    # request's minutes. A run takes a few minutes longer for it.
    name: Frontend smoke (${{ matrix.shard_id }}/2)
    needs: [changes, web-dist]
    if: ${{ needs.changes.outputs.run_e2e_smoke == 'true' }}
    runs-on: ubuntu-latest
    # Observed 9 to 15 minutes per shard, then 25 for shard 1 once the real-server specs joined (15 Oct), and more than
    # 29 on run 38731946211, cancelled at the old 30.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - shard_id: 1
            shard: "1/2"
          - shard_id: 2
            shard: "2/2"
    env:
      # The suite's web server skips its own build and serves the one web-dist made (apps/web/playwright.config.ts).
      DELUNO_SMOKE_PREBUILT: "1"
      PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ github.workspace }}/playwright-results-${{ matrix.shard_id }}.json
      PLAYWRIGHT_HTML_OPEN: never

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Restore backend dependencies
        run: dotnet restore Deluno.slnx

      - name: Install frontend dependencies
        run: npm ci

      - name: Install browser dependencies
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      # The host serves apps/web/dist as its wwwroot, so this lands before `dotnet run` builds it.
      - name: Download web build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-dist
          path: apps/web/dist

      - name: Run frontend smoke tests
        run: npm --workspace apps/web run test:smoke -- --shard=${{ matrix.shard }} --reporter=dot,json,html

      - name: Summarize smoke test results
        if: always()
        run: node scripts/summarize-test-results.mjs playwright "$PLAYWRIGHT_JSON_OUTPUT_NAME" "Frontend smoke (${{ matrix.shard_id }}/2)"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-${{ matrix.shard_id }}
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          if-no-files-found: ignore

  docker:
    name: Container image
    needs: changes
    if: ${{ needs.changes.outputs.run_docker == 'true' }}
    runs-on: ubuntu-latest
    # Observed 1 to 7 minutes for the image; the proofs below add a few more.
    timeout-minutes: 25
    env:
      IMAGE: deluno-ci:${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The recovery proof builds the declared historical baseline below.
          # Keep its commit resolvable as main advances; a shallow fixed depth
          # silently expires this required upgrade/recovery test after enough
          # ordinary merges.
          fetch-depth: 0
          # The baseline is named by a tag (baseline/schema-upgrade-...), so tags must come too.
          fetch-tags: true

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Validate Compose contract
        run: docker compose config --quiet

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true

      # A known HIGH or CRITICAL vulnerability with a fix already available blocks the change. ignore-unfixed, because
      # failing on something no upstream fix exists for yet would make every run wait on an unrelated CVE.
      - name: Trivy scan of the image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Build populated-schema baseline image
        env:
          BASELINE_REVISION: baseline/schema-upgrade-2026-08-30
        run: |
          set -euo pipefail
          git cat-file -e "${BASELINE_REVISION}^{commit}"
          baseline_context="$(mktemp -d)"
          trap 'rm -rf "$baseline_context"' EXIT
          git archive "$BASELINE_REVISION" | tar -x -C "$baseline_context"
          cp Dockerfile "$baseline_context/Dockerfile"
          cp .dockerignore "$baseline_context/.dockerignore"
          # The baseline predates the supported SDK workspace. Its production
          # host/web sources are otherwise built through the same Dockerfile.
          sed -i '/^COPY sdk\/typescript\/package\.json /d' "$baseline_context/Dockerfile"
          # It also predates embedding the release notes (#1037).
          sed -i '/^COPY RELEASE_NOTES\.md /d' "$baseline_context/Dockerfile"
          baseline_image="deluno-schema-baseline:${GITHUB_RUN_ID}"
          docker build --tag "$baseline_image" "$baseline_context"
          echo "DOCKER_BASELINE_IMAGE=$baseline_image" >> "$GITHUB_ENV"

      - name: Verify persistent data and failed-replacement recovery
        run: bash scripts/test-docker-recovery.sh "$DOCKER_BASELINE_IMAGE" "$IMAGE"

      # The README's docker run line and docker-compose.yml are taken from the README itself, pointed at this
      # image, started, waited on until /api/health/ready answers, and taken down again.
      - name: Prove the README install examples
        timeout-minutes: 10
        run: bash scripts/test-readme-docker-examples.sh "$IMAGE"

  # The end-to-end suite on Docker Compose (docs/exec-plans/active/PLAN-E2E-IN-CI.md): this commit's own image, the real
  # download client, Weir and the suite's fixture on one private network, one group per job (they cannot interfere).
  # Each spec reads every application's own API. Add a group by adding its name to the matrix and its spec to tests/e2e.
  e2e-linux:
    name: End-to-end (${{ matrix.group }})
    needs: changes
    if: ${{ needs.changes.outputs.run_e2e_linux == 'true' }}
    runs-on: ubuntu-latest
    # The films group took about 75 seconds on a workstation once the images were pulled; the image build is the rest.
    timeout-minutes: 40
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        group: [films]
    env:
      DELUNO_IMAGE: deluno-e2e:${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build Deluno's image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: ${{ env.DELUNO_IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true

      # Weir's image is pulled anonymously from its public registry page (by digest, tests/e2e/compose.yaml).
      - name: Bring the stack up
        run: docker compose -f tests/e2e/compose.yaml up --build --wait --detach

      - name: Run the ${{ matrix.group }} group
        run: npx playwright test -c tests/e2e/playwright.config.ts ${{ matrix.group }}

      - name: Keep every application's log
        if: ${{ always() }}
        run: |
          mkdir -p artifacts/e2e/logs
          for service in deluno qbittorrent weir fixture; do
            docker compose -f tests/e2e/compose.yaml logs --no-color "$service" > "artifacts/e2e/logs/$service.log" 2>&1 || true
          done

      - name: Take the stack down
        if: ${{ always() }}
        run: docker compose -f tests/e2e/compose.yaml down --volumes

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() }}
        with:
          name: e2e-${{ matrix.group }}
          path: artifacts/e2e/
          retention-days: 14
          if-no-files-found: ignore

  # The installable build of this exact commit, for the golden path (docs/golden-path.md): only a manual run builds it
  # ("Run workflow" on any ref or commit), because a release is not tagged until the golden path has passed on a build
  # like this one. The same steps as the release's windows job, minus signing and delta packages, so what the golden
  # path installs is what a release of the commit would install. The artifact is named by the commit, and is kept for
  # two weeks.
  windows-installer:
    name: Windows installer
    needs: changes
    if: ${{ needs.changes.outputs.run_windows_installer == 'true' }}
    runs-on: windows-latest
    # Windows minutes bill at twice the rate. The release's packaging has been seen to take 4.5 to 7 minutes.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "npm"

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      # The version the commit itself carries (Directory.Build.props), so the installer says what a release of this
      # commit would say. A pre-release version is packed on the rc channel, as the release does.
      - name: Read the version
        id: version
        shell: pwsh
        run: |
          $props = Get-Content Directory.Build.props -Raw
          $version = [regex]::Match($props, '<Version>\s*([^<\s]+)\s*</Version>').Groups[1].Value
          if (-not $version) { Write-Error "No <Version> in Directory.Build.props."; exit 1 }
          $channel = if ($version.StartsWith("0.") -or $version -match "-(rc|beta|preview)([.-]|$)") { "rc" } else { "stable" }
          "version=$version" >> $env:GITHUB_OUTPUT
          "channel=$channel" >> $env:GITHUB_OUTPUT

      - run: npm ci

      - name: Build frontend
        run: npm run build:web

      - name: Publish Deluno.Tray (win-x64)
        shell: pwsh
        run: |
          dotnet publish apps/windows-tray/Deluno.Tray.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=false `
            -p:Version=${{ steps.version.outputs.version }} `
            -p:DelunoUpdateChannel=${{ steps.version.outputs.channel }} `
            -o artifacts/windows/bin

      - name: Cache FFmpeg
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tools/ffmpeg/win-x64
          key: ${{ runner.os }}-ffmpeg-${{ hashFiles('scripts/fetch-ffmpeg.ps1') }}

      - name: Cache UnRAR
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tools/unrar/win-x64
          key: ${{ runner.os }}-unrar-${{ hashFiles('scripts/fetch-unrar.ps1') }}

      - name: Bundle FFmpeg and UnRAR
        shell: pwsh
        run: |
          ./scripts/fetch-ffmpeg.ps1 -RuntimeIdentifier win-x64
          New-Item -ItemType Directory -Force -Path artifacts/windows/bin/tools/ffmpeg | Out-Null
          Copy-Item -Path "tools/ffmpeg/win-x64/*" -Destination artifacts/windows/bin/tools/ffmpeg -Recurse -Force
          foreach ($required in @("ffmpeg.exe", "ffprobe.exe")) {
            if (-not (Test-Path "artifacts/windows/bin/tools/ffmpeg/$required")) { Write-Error "$required is missing from the package"; exit 1 }
          }
          ./scripts/fetch-unrar.ps1 -RuntimeIdentifier win-x64
          New-Item -ItemType Directory -Force -Path artifacts/windows/bin/tools/unrar | Out-Null
          Copy-Item -Path "tools/unrar/win-x64/*" -Destination artifacts/windows/bin/tools/unrar -Exclude ".sha256" -Force

      - name: Install Velopack CLI
        shell: pwsh
        run: dotnet tool install -g vpk --version 0.0.1298

      - name: Create the installer
        shell: pwsh
        run: |
          $env:PATH += ";$env:USERPROFILE\.dotnet\tools"
          vpk pack `
            --packId Deluno `
            --packVersion ${{ steps.version.outputs.version }} `
            --packDir artifacts/windows/bin `
            --mainExe Deluno.exe `
            --packTitle Deluno `
            --icon installer/deluno.ico `
            --channel ${{ steps.version.outputs.channel }} `
            --runtime win-x64 `
            --outputDir artifacts/windows/velopack
          if (-not (Get-ChildItem artifacts/windows/velopack -Filter "*Setup*.exe")) { Write-Error "No Setup executable was produced."; exit 1 }

      - name: Upload the installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deluno-windows-${{ github.sha }}
          path: |
            artifacts/windows/velopack/*Setup*.exe
            artifacts/windows/velopack/*.nupkg
            artifacts/windows/velopack/releases.*.json
            artifacts/windows/velopack/RELEASES*
          if-no-files-found: error
          retention-days: 14

  # Coverage of the Node code (the scripts and the metadata gateway), by node --test's own v8 coverage.
  coverage-node:
    name: Node coverage
    needs: changes
    if: ${{ needs.changes.outputs.run_coverage == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Run the scripts' tests with coverage
        run: |
          mkdir -p coverage-node
          node --test --experimental-test-coverage \
            --test-coverage-include="scripts/**/*.mjs" --test-coverage-exclude="**/*.test.mjs" \
            --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=lcov --test-reporter-destination=coverage-node/scripts.lcov \
            "scripts/**/*.test.mjs"

      - name: Run the metadata gateway's tests with coverage
        working-directory: services/metadata-gateway
        run: |
          node --test --experimental-test-coverage \
            --test-coverage-include="src/**/*.js" \
            --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=lcov --test-reporter-destination=../../coverage-node/metadata-gateway.lcov

      - name: Upload Node coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-node
          path: coverage-node/*.lcov
          if-no-files-found: error
          retention-days: 7

  # Merges the three coverage reports into one per-file table, holds every file to its baseline
  # (docs/testing/coverage-baseline.json) and publishes the table. Issue 1268; the standard is docs/testing/STRATEGY.md.
  coverage:
    name: Coverage report and ratchet
    needs: [changes, backend, web, coverage-node]
    if: ${{ needs.changes.outputs.run_coverage == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Download the coverage reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coverage-*
          path: coverage-in

      # ReportGenerator, pinned in .config/dotnet-tools.json, merges the seven test projects' coverage of the same file.
      - name: Merge the .NET reports
        run: |
          dotnet tool restore
          dotnet tool run reportgenerator \
            "-reports:coverage-in/coverage-dotnet/**/coverage.cobertura.xml" \
            "-targetdir:coverage-out/dotnet" \
            "-reporttypes:Cobertura;HtmlInline" \
            "-assemblyfilters:+Deluno.*;-Deluno.*.Tests"

      - name: One per-file table for .NET, web and Node
        run: |
          node scripts/coverage/merge-coverage.mjs \
            --cobertura coverage-out/dotnet/Cobertura.xml \
            --lcov coverage-in/coverage-web/lcov.info=apps/web \
            --lcov coverage-in/coverage-node/scripts.lcov \
            --lcov coverage-in/coverage-node/metadata-gateway.lcov \
            --exclusions docs/testing/coverage-exclusions.json \
            --out-json coverage-out/coverage-report.json \
            --out-md coverage-out/coverage-report.md
          cat coverage-out/coverage-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: No file is below its baseline, and every exclusion has a reason
        run: node scripts/check-coverage-ratchet.mjs --report coverage-out/coverage-report.json

      # The baseline this run would write, for the owner to review and commit (docs/testing/COVERAGE.md, "How the
      # baseline is filled"). CI itself never commits it.
      - name: Propose the raised baseline
        if: ${{ !cancelled() }}
        run: |
          cp docs/testing/coverage-baseline.json coverage-out/coverage-baseline.json
          node scripts/check-coverage-ratchet.mjs --report coverage-out/coverage-report.json --baseline coverage-out/coverage-baseline.json --update

      - name: Upload the coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: coverage-out/
          if-no-files-found: error
          retention-days: 30

  # Switched on by the repository variable DELUNO_MUTATION_ON_PUSH=true (default off: the job has not run in CI yet);
  # while it is off the flag is false, the job is skipped and ci-passed counts it as not due.
  # Mutation testing on the changed files (issue 1269, docs/testing/STRATEGY.md measure 3): Stryker.NET's diff mode
  # (--since) for the .NET projects the change reaches, StrykerJS on the changed web, sdk and gateway source files.
  # Every mutant that survived or was never covered fails the job, unless docs/testing/mutation-equivalents.json lists
  # it with the reason no test can kill it. The nightly run (mutation-nightly.yml) scores whole projects.
  mutation:
    name: Mutation on the changed files
    needs: changes
    if: ${{ vars.DELUNO_MUTATION_ON_PUSH == 'true' && needs.changes.outputs.run_mutation == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install the pinned tools
        run: |
          dotnet tool restore
          npm ci

      # The base is the pull request's base commit, or the commit before the push. A first push or a force push has no
      # base to diff against: the job says so and stops, and the nightly run still scores everything.
      - name: Mutate the changed files
        id: run
        env:
          BEFORE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BEFORE" ] || [ -z "${BEFORE//0/}" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "No earlier commit to compare with (a first push or a force push): the changed-file mutation is skipped."
            echo "ran=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node scripts/mutation/run-changed.mjs --base "$BEFORE" --out mutation-reports
          echo "ran=true" >> "$GITHUB_OUTPUT"

      - name: No mutant survives, unless it is listed as equivalent
        if: ${{ steps.run.outputs.ran == 'true' }}
        run: |
          mkdir -p mutation-reports
          node scripts/check-mutation-ratchet.mjs --reports mutation-reports --survivors

      - name: Upload the mutation reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-changed
          path: mutation-reports/
          if-no-files-found: ignore
          retention-days: 7

  # The verdict. `always()` so it reports even when a job it needs failed or was skipped.
  ci-passed:
    needs: [changes, repo-checks, backend, web-dist, web, e2e-smoke, docker, windows-installer, e2e-linux, coverage-node, coverage, mutation]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Every job that was due passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: node scripts/ci-passed.mjs
