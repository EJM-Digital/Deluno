name: CI

on:
  # Not on a push to main. Pull requests merge one at a time and up to date, so
  # main receives exactly the tree its pull request run already tested, and
  # running it again was a third of all the Actions minutes Deluno used
  # (22 Sep 2026). "Run workflow" re-checks main by hand when that is wanted.
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Use the PR number rather than the merge ref so successive pushes to the
  # same PR always cancel the superseded run. A run started by hand is not.
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  agent-readiness:
    name: Agent readiness
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate agent-readable repository map
        shell: pwsh
        run: ./scripts/validate-agent-readiness.ps1

  backend:
    name: Backend build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore backend dependencies
        run: dotnet restore Deluno.slnx

      - name: Build backend
        run: dotnet build Deluno.slnx --configuration Release --no-restore

      - name: Run backend tests
        shell: pwsh
        run: ./scripts/test-dotnet-serial.ps1

      - name: Upload backend test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: "**/TestResults/*.trx"
          if-no-files-found: ignore

  frontend-quality:
    name: Frontend quality
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm --workspace apps/web run lint

      - name: Check for orphaned frontend modules
        working-directory: apps/web
        run: npm run check:orphans

      - name: Build frontend
        run: npm run build:web

      - name: Typecheck supported TypeScript SDK
        run: npm run typecheck:sdk

      - name: Run frontend unit tests
        run: npm run test:unit:web

  frontend-smoke:
    # Two shards, not four: each shard repeats about 75 seconds of setup, and
    # the suite is two-thirds of a pull request's minutes. A run takes a few
    # minutes longer for it.
    name: Frontend smoke (${{ matrix.shard_id }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - shard_id: 1
            shard: "1/2"
          - shard_id: 2
            shard: "2/2"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Restore backend dependencies
        run: dotnet restore Deluno.slnx

      - name: Install frontend dependencies
        run: npm ci

      - name: Install browser dependencies
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Build frontend
        run: npm run build:web

      - name: Run frontend smoke tests
        run: npm --workspace apps/web run test:smoke -- --shard=${{ matrix.shard }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.shard_id }}
          path: apps/web/playwright-report/
          if-no-files-found: ignore
