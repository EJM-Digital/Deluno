# Weekly dependency audit. Advisories are published every day, so a tree that was clean when CI last ran can be
# vulnerable today. This looks at what ships (not the dev tools) and fails when an advisory applies, which GitHub
# reports to the repository owner by e-mail. Dependabot security updates open the fixing pull requests
# (.github/dependabot.yml); this is the check that notices when none has been opened.
name: Dependency audit

on:
  schedule:
    # Mondays, 19:23 UTC.
    - cron: "23 19 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  dotnet:
    name: NuGet packages
    runs-on: ${{ vars.DELUNO_LINUX_RUNS_ON && fromJSON(vars.DELUNO_LINUX_RUNS_ON) || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Deluno.slnx

      # `dotnet list package --vulnerable` exits 0 even when it finds something, so the report is read.
      - name: Vulnerable packages, direct and transitive
        run: |
          set -o pipefail
          dotnet list Deluno.slnx package --vulnerable --include-transitive 2>&1 | tee audit.txt
          if grep -q "has the following vulnerable packages" audit.txt; then
            echo "::error::A NuGet package has a known vulnerability. See the report above."
            exit 1
          fi

  npm:
    name: npm packages
    runs-on: ${{ vars.DELUNO_LINUX_RUNS_ON && fromJSON(vars.DELUNO_LINUX_RUNS_ON) || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      # Reads package-lock.json; nothing is installed. Production dependencies only, high severity and up: the web
      # app's dev tools never ship.
      - name: Production dependencies
        run: npm audit --omit=dev --audit-level=high
