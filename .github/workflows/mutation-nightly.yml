# Nightly full mutation run (issue 1269, docs/testing/STRATEGY.md measure 3). Every push already mutates its changed
# files in ci.yml; this scores whole projects, publishes the score per project, and fails when a score falls below the
# checked-in threshold (docs/testing/mutation-thresholds.json), which only goes up. Surviving mutants are published
# in the report as findings for the owner; they do not fail this run by themselves.
#
# Each .NET production project is one job (Stryker.NET, its stryker-config.json, the test projects that cover it), so a
# slow project cannot starve the others. The web app, the API client and the metadata gateway are StrykerJS jobs.
name: Mutation (fortnightly)

on:
  schedule:
  # Saturdays, 11:17 UTC (Saturday 22:17 Sydney, AEDT), and only every second one: cron cannot say fortnightly, so the
  # first job skips the run on odd ISO weeks. At most 6 jobs at once (4 .NET, 2 JavaScript). Off the top of the hour.
    - cron: "17 11 * * 6"
  workflow_dispatch:
    inputs:
      scope:
        description: "risky = only the risky areas (docs/testing/mutation-risky-areas.json: their .NET projects and folders; a surviving mutant there fails the run); all = every project and the JavaScript packages, scored against the thresholds"
        type: choice
        options: [risky, all]
        default: risky

concurrency:
  group: mutation-nightly
  cancel-in-progress: false

permissions:
  contents: read

env:
  # The schedule always measures everything; a run started by hand measures what its `scope` input says (default: risky).
  SCOPE: ${{ github.event_name == 'workflow_dispatch' && inputs.scope || 'all' }}
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  # Every push already mutates its changed files (ci.yml); the whole-project scores move slowly, so they are measured
  # every second week (the owner, 1 Nov 2026). A run started by hand always runs.
  fortnight:
    name: This week's run
    runs-on: ${{ vars.DELUNO_LINUX_RUNS_ON && fromJSON(vars.DELUNO_LINUX_RUNS_ON) || 'ubuntu-latest' }}
    timeout-minutes: 5
    outputs:
      run: ${{ steps.week.outputs.run }}
    steps:
      - name: Even ISO week, or started by hand
        id: week
        run: |
          week=$(date -u +%V)
          if [ "${{ github.event_name }}" != "schedule" ] || [ $((10#$week % 2)) -eq 0 ]; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; echo "ISO week $week is odd: this fortnight's run was last week."; fi

  matrix:
    name: Projects to mutate
    needs: fortnight
    if: ${{ needs.fortnight.outputs.run == 'true' }}
    runs-on: ${{ vars.DELUNO_LINUX_RUNS_ON && fromJSON(vars.DELUNO_LINUX_RUNS_ON) || 'ubuntu-latest' }}
    timeout-minutes: 5
    outputs:
      dotnet: ${{ steps.matrix.outputs.dotnet }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Every production project has a config; list them
        id: matrix
        run: |
          node scripts/mutation/gen-stryker-configs.mjs --check
          echo "dotnet=$(node scripts/mutation/gen-stryker-configs.mjs --matrix "$SCOPE")" >> "$GITHUB_OUTPUT"

  dotnet:
    name: ${{ matrix.project }}
    needs: matrix
    runs-on: ${{ matrix.os == 'windows-latest' && (vars.DELUNO_WINDOWS_RUNS_ON && fromJSON(vars.DELUNO_WINDOWS_RUNS_ON) || 'windows-latest') || (vars.DELUNO_LINUX_RUNS_ON && fromJSON(vars.DELUNO_LINUX_RUNS_ON) || 'ubuntu-latest') }}
    # A hosted job stops at six hours; a project that does not finish in that time must be split, not skipped.
    # (A self-hosted runner has no such limit, but the same budget keeps the night bounded.)
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.matrix.outputs.dotnet) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Use this job's own temp folder
        if: ${{ runner.os == 'Linux' }}
        shell: bash
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"

      # Stopped short of the job's own limit, so a slow project still uploads what it wrote and the score job runs.
      - name: Stryker.NET, pinned in .config/dotnet-tools.json
        timeout-minutes: 330
        shell: bash
        env:
          # Set only for a project that is risky in some folders: the globs replace the config's `mutate`.
          MUTATE: ${{ matrix.mutate }}
        run: |
          dotnet tool restore
          mutate_args=()
          if [ -n "$MUTATE" ]; then
            IFS=',' read -ra globs <<< "$MUTATE"
            for g in "${globs[@]}"; do mutate_args+=(--mutate "$g"); done
          fi
          dotnet tool run dotnet-stryker -f "${{ matrix.config }}" "${mutate_args[@]}" --output "$PWD/StrykerOutput/${{ matrix.project }}"
          mkdir -p mutation-reports
          cp "StrykerOutput/${{ matrix.project }}/reports/mutation-report.json" "mutation-reports/${{ matrix.project }}.json"

      # Uploaded even when the run was cancelled or the project timed out, so the projects that finished still count.
      - name: Upload the report
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-${{ matrix.project }}
          path: mutation-reports/
          if-no-files-found: warn
          retention-days: 7

  javascript:
    name: ${{ matrix.name }}
    needs: fortnight
    # The JavaScript packages hold no risky area, so a risky-only run leaves them out.
    if: ${{ needs.fortnight.outputs.run == 'true' && (github.event_name != 'workflow_dispatch' || inputs.scope == 'all') }}
    runs-on: ${{ vars.DELUNO_LINUX_RUNS_ON && fromJSON(vars.DELUNO_LINUX_RUNS_ON) || 'ubuntu-latest' }}
    timeout-minutes: 340
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - name: web
            dir: apps/web
          - name: sdk
            dir: sdk/typescript
          - name: metadata-gateway
            dir: services/metadata-gateway
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install the pinned packages
        run: npm ci

      - name: StrykerJS
        timeout-minutes: 320
        working-directory: ${{ matrix.dir }}
        run: npx stryker run

      - name: Collect the report
        run: |
          mkdir -p mutation-reports
          cp "${{ matrix.dir }}/reports/mutation/${{ matrix.name }}.json" "mutation-reports/${{ matrix.name }}.json"

      # Uploaded even when the run was cancelled or the project timed out, so the projects that finished still count.
      - name: Upload the report
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-${{ matrix.name }}
          path: mutation-reports/
          if-no-files-found: warn
          retention-days: 7

  # The score per project, held to its threshold. The proposed raise is published for the owner to review and commit;
  # this workflow never commits it.
  score:
    name: Score per project and ratchet
    needs: [fortnight, dotnet, javascript]
    # Scores whatever finished, even after a cancel or a timeout; a project with no report is listed as not measured.
    if: ${{ always() && needs.fortnight.outputs.run == 'true' }}
    runs-on: ${{ vars.DELUNO_LINUX_RUNS_ON && fromJSON(vars.DELUNO_LINUX_RUNS_ON) || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: mutation-*
          path: mutation-reports
          merge-multiple: true

      - name: Publish the score per project
        run: |
          node scripts/check-mutation-ratchet.mjs --reports mutation-reports --summary >> "$GITHUB_STEP_SUMMARY"

      # A risky-only run mutates part of a project, so its score is not the project's score: it is judged by its
      # survivors (a survivor in a risky area fails, unless listed as equivalent) and never proposes a threshold.
      - name: No project is below its threshold
        run: |
          if [ "$SCOPE" = "risky" ]; then node scripts/check-mutation-ratchet.mjs --reports mutation-reports --survivors
          else node scripts/check-mutation-ratchet.mjs --reports mutation-reports; fi

      - name: Propose the raised thresholds
        if: ${{ !cancelled() && env.SCOPE == 'all' }}
        run: |
          mkdir -p mutation-out
          cp docs/testing/mutation-thresholds.json mutation-out/mutation-thresholds.json
          node scripts/check-mutation-ratchet.mjs --reports mutation-reports --thresholds mutation-out/mutation-thresholds.json --update

      - name: Upload the scores and the proposed thresholds
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-score
          path: |
            mutation-reports/
            mutation-out/
          if-no-files-found: warn
          retention-days: 7
