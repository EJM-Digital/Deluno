name: Docker image

on:
  pull_request:
    branches: [main]
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: Build and verify container image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # The recovery proof builds the declared historical baseline below.
          # Keep its commit resolvable as main advances; a shallow fixed depth
          # silently expires this required upgrade/recovery test after enough
          # ordinary merges.
          fetch-depth: 0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Calculate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=pr
            type=ref,event=branch
            type=raw,value=ci-${{ github.run_id }},enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Validate Compose contract
        run: docker compose config --quiet

      - name: Build image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          load: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build populated-schema baseline image
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        env:
          BASELINE_REVISION: 38e5ae8
        run: |
          set -euo pipefail
          git cat-file -e "${BASELINE_REVISION}^{commit}"
          baseline_context="$(mktemp -d)"
          trap 'rm -rf "$baseline_context"' EXIT
          git archive "$BASELINE_REVISION" | tar -x -C "$baseline_context"
          cp Dockerfile "$baseline_context/Dockerfile"
          cp .dockerignore "$baseline_context/.dockerignore"
          # The baseline predates the supported SDK workspace. Its production
          # host/web sources are otherwise built through the same Dockerfile.
          sed -i '/^COPY sdk\/typescript\/package\.json /d' "$baseline_context/Dockerfile"
          baseline_image="deluno-schema-baseline:${GITHUB_RUN_ID}"
          docker build --tag "$baseline_image" "$baseline_context"
          echo "DOCKER_BASELINE_IMAGE=$baseline_image" >> "$GITHUB_ENV"

      - name: Verify persistent data and failed-replacement recovery
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          image_tag="$(printf '%s\n' "$IMAGE_TAGS" | sed -n '1p')"
          bash scripts/test-docker-recovery.sh "$DOCKER_BASELINE_IMAGE" "$image_tag"

      - name: Verify pushed digest is addressable
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          IMAGE_NAME: ghcr.io/${{ github.repository }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: docker buildx imagetools inspect "${IMAGE_NAME}@${IMAGE_DIGEST}"
